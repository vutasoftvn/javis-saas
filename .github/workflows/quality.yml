    # Tier-1 cross-plane E2E: boot cả 4 vùng (agent worker, apps/cosa, services/cosa,
    # services/company) dưới subprocess thật + Postgres disposable, model=fake.
    # KHÔNG có `if:` guard → chạy blocking trên mọi push/PR (khác e2e-golden-path
    # vốn chỉ chạy nhánh main).
    #
    # Job này CHỨNG MINH: transport cross-plane thật (HTTP giữa 4 process), auth +
    # tenant-isolation ở biên apps/cosa và services/cosa, các bất biến fail-closed
    # (policy snapshot không lấy được ⇒ DENY, không ngầm ALLOW), và một vòng
    # dispatch worker cross-process THẬT (schedule → poll → claim → lease →
    # execute → complete) + outbox→relay→inbox idempotent.
    # Job này CHƯA exercise: agent kernel, CapabilityGateway, governance approval
    # binding (`run_id + tool_call_id + checkpoint_ref`), và projection run→signal —
    # tất cả bị chặn sau bug B5 (delegation token `local_session` bị gateway
    # services/cosa từ chối ở hop tenant-policy). Chi tiết + phạm vi từng scenario:
    # docs/testing/cross-plane-e2e.md.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # Superuser dùng cho scripts/bootstrap-postgres-cluster.sh và
      # tests/e2e/stack/disposable_postgres.py (_ADMIN default = postgres/postgres).
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      # Các giá trị này PHẢI khớp _APP_PWD / _MIG_PWD hard-code trong
      # tests/e2e/stack/disposable_postgres.py — nếu lệch, disposable cluster
      # không connect được. KHÔNG dùng ci-* như job `services:`.
      AGENT_APP_PASSWORD: change-me-agent-app
      AGENT_MIGRATOR_PASSWORD: change-me-agent-migrator
      COSA_APP_PASSWORD: change-me-cosa-app
      COSA_MIGRATOR_PASSWORD: change-me-cosa-migrator
      WORKSPACE_APP_PASSWORD: change-me-workspace-app
      WORKSPACE_MIGRATOR_PASSWORD: change-me-workspace-migrator
      # disposable_postgres.py và subprocess_stack.py đọc os.environ["PYTHON"],
      # default .venv/bin/python không tồn tại trong CI → dùng system python.
      PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            packages/agent/requirements.txt
            apps/cosa/requirements.txt
      - name: Install Encore CLI
        run: |
          curl -L https://encore.dev/install.sh | bash
          echo "$HOME/.encore/bin" >> "$GITHUB_PATH"
      - name: Install Node deps (both Encore services)
        run: |
          (cd services/company && npm ci)
          (cd services/cosa && npm ci)
      - name: Install Python deps
        run: |
          pip install --require-hashes -r packages/agent/requirements.txt -r apps/cosa/requirements.txt
          pip install -r requirements-dev.txt pytest pytest-asyncio httpx pyjwt psycopg2-binary
      - name: Bootstrap canonical Postgres cluster roles
        run: bash scripts/bootstrap-postgres-cluster.sh
      - name: Cross-plane smoke (S1-S4)
        run: make e2e-cross-plane-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-cross-plane-smoke-results
          path: test-results/e2e-smoke.xml
          if-no-files-found: error
