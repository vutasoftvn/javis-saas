name: quality

on:
  push:
  pull_request:
  workflow_dispatch:
  # Task 11 — "release candidate gate": job `frontend-integration` (macOS UI
  # + disposable fixture) chỉ chạy nightly/on-demand, KHÔNG chặn mỗi PR (build
  # macOS app + chạy N file integration_test tốn nhiều phút hơn hẳn analyzer/
  # unit test) — xem M4 trong plan gốc
  # (`.superpowers/sdd/2026-09-02-frontend-trust-and-ux-hardening/`).
  schedule:
    - cron: '0 18 * * *' # 01:00 ICT hàng ngày

permissions:
  contents: read

jobs:
  # Task 11 — tầng PR-fast của "staged CI": analyzer + unit test (bao gồm
  # golden test đã có ở `frontend/test/golden/`, Task 9/10 — `flutter test`
  # ở đây chạy TOÀN BỘ `test/**/*_test.dart`, không cần bước riêng) chạy trên
  # MỌI push/PR. Contract check (`frontend-api-contract-check`) nằm ở job
  # `boundaries` bên dưới — không lặp lại ở đây. Job macOS UI integration
  # nặng hơn nằm riêng ở `frontend-integration` (nightly/on-demand).
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: stable
          cache: true
      - run: flutter pub get
        working-directory: frontend
      - run: mkdir -p ../test-results
        working-directory: frontend
      - run: flutter test --coverage --machine > ../test-results/frontend.json
        working-directory: frontend
      # Line-coverage floor áp cho code logic (services/controllers/models/core).
      # File view/widget Flutter được phủ bởi tầng test riêng (widget/golden/
      # accessibility/integration_test), không tính vào floor này — xem
      # frontend/README.md mục "Coverage".
      - run: node scripts/check_frontend_coverage.mjs frontend/coverage/lcov.info --minimum=46 --exclude='**/views/**,**/widgets/**'
      - run: mv coverage/lcov.info ../test-results/frontend-lcov.info
        working-directory: frontend
      - run: flutter analyze
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-test-results
          path: |
            test-results/frontend.json
            test-results/frontend-lcov.info
          if-no-files-found: error

  # Task 11 — tầng release-candidate của "staged CI": macOS UI thật
  # (`flutter test <file> -d macos`) chạy từng file integration_test riêng lẻ
  # chống lại `FixtureServer` disposable (HTTP loopback thật, không mock
  # `ApiClient`, không chạm DB/credential thật nào) — xem
  # `docs/testing/frontend-integration.md`. CHỈ chạy nightly (`schedule`) hoặc
  # khi bấm tay (`workflow_dispatch`) — KHÔNG chặn mỗi PR (build macOS app +
  # N file integration_test tốn nhiều phút hơn hẳn tầng `frontend` ở trên).
  #
  # Nguyên tắc lõi bắt buộc của Task 11: "A skipped test is not a green
  # release gate" — nếu KHÔNG tìm thấy file `integration_test/*_test.dart`
  # nào, job này FAIL (coi là lỗi hạ tầng test), KHÔNG được âm thầm pass vì
  # "không có gì để chạy". Mỗi bước test dùng `set -o pipefail` qua
  # `bash -euo pipefail` mặc định của `run:` step nên một `flutter test` lỗi
  # sẽ làm cả step (và cả job) fail ngay, không bị nuốt bởi lệnh sau nó.
  frontend-integration:
    runs-on: macos-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: stable
          cache: true
      - run: flutter pub get
        working-directory: frontend
      - name: Fail closed if no integration_test files exist (no silent skip)
        working-directory: frontend
        run: |
          shopt -s nullglob
          files=(integration_test/*_test.dart)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No integration_test/*_test.dart found — treating as infrastructure failure, not a skip."
            exit 1
          fi
          echo "found_files=${#files[@]}" >> "$GITHUB_ENV"
      - name: Run each integration_test file against its own disposable fixture
        working-directory: frontend
        run: |
          mkdir -p ../test-results
          summary="../test-results/frontend-integration-summary.txt"
          : > "$summary"
          status=0
          for f in integration_test/*_test.dart; do
            echo "── flutter test $f -d macos ──" | tee -a "$summary"
            if flutter test "$f" -d macos -r compact 2>&1 | tee -a "$summary"; then
              echo "PASS $f" >> "$summary"
            else
              echo "FAIL $f" >> "$summary"
              status=1
            fi
          done
          exit $status
      - uses: actions/setup-python@v5
        if: always()
        with:
          python-version: '3.11'
      - name: Publish GHOST route count / allowlist expiry / integration summary
        if: always()
        run: |
          {
            echo "## Frontend release-gate summary"
            echo ""
            echo "### GHOST routes (docs/architecture/generated/route-inventory.snapshot.json)"
            python3 scripts/ci/frontend_release_summary.py
            echo ""
            echo "### Frontend API contract allowlist expiry (scripts/frontend-api-contract-allowlist.json)"
            node scripts/ci/frontend_allowlist_expiry.mjs
            echo ""
            echo "### Integration test summary"
            (cat test-results/frontend-integration-summary.txt 2>/dev/null | grep -E '^(PASS|FAIL) ') || echo "(no summary file produced — job likely failed before running any test)"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-integration-test-results
          path: test-results/frontend-integration-summary.txt
          if-no-files-found: error

  # Task 18 — leg `E2E_MODE=real` của `frontend-integration`: 3 file
  # `integration_test/*_test.dart` chạy chống lại stack 4 plane THẬT (Postgres
  # disposable + `services/company` + `services/cosa` + `apps/cosa`), thay vì
  # `FixtureServer` in-process. Xem `docs/testing/frontend-integration.md`
  # §Dual-mode + `frontend/tool/run_integration_real.sh`.
  #
  # TRUNG THỰC: job này MỚI, boot 4 tiến trình + Postgres disposable trên
  # runner `macos-latest` (khác `e2e-cross-plane-smoke` vốn chạy Ubuntu với
  # Postgres dưới dạng docker `services:` — `macos-latest` KHÔNG hỗ trợ docker
  # service containers, nên ở đây dùng Postgres cài sẵn qua Homebrew của
  # runner image). Đường boot-stack-trên-macOS-runner này CHƯA được xác nhận
  # chạy xanh trong một lần chạy CI thật (chỉ verify local: `flutter analyze`
  # sạch + `run_integration_real.sh` đúng cú pháp + wiring dart-define đã test
  # bằng cổng không tồn tại, xem task-18-report.md). `continue-on-error: true`
  # NÊN giữ nguyên cho tới khi có ít nhất một lần chạy nightly xanh thật — sau
  # đó có thể gỡ để leg này thật sự chặn (blocking).
  frontend-integration-real:
    runs-on: macos-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    timeout-minutes: 30
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      AGENT_APP_PASSWORD: change-me-agent-app
      AGENT_MIGRATOR_PASSWORD: change-me-agent-migrator
      COSA_APP_PASSWORD: change-me-cosa-app
      COSA_MIGRATOR_PASSWORD: change-me-cosa-migrator
      WORKSPACE_APP_PASSWORD: change-me-workspace-app
      WORKSPACE_MIGRATOR_PASSWORD: change-me-workspace-migrator
      PYTHON: python3
      E2E_TEST_SEED_ENABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: stable
          cache: true
      - run: flutter pub get
        working-directory: frontend
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Encore CLI
        run: |
          curl -L https://encore.dev/install.sh | bash
          echo "$HOME/.encore/bin" >> "$GITHUB_PATH"
      - name: Install Node deps (both Encore services)
        run: |
          (cd services/company && npm ci)
          (cd services/cosa && npm ci)
      - name: Install Python deps (apps/cosa, packages/agent)
        run: |
          pip install --require-hashes -r packages/agent/requirements.txt -r apps/cosa/requirements.txt
      - name: Start Postgres (Homebrew, preinstalled on macos-latest runner image)
        run: |
          brew services start postgresql@14 || brew services start postgresql
          for i in $(seq 1 30); do
            pg_isready -h 127.0.0.1 -p 5432 -U "$(whoami)" && break
            sleep 2
          done
          psql -h 127.0.0.1 -U "$(whoami)" -d postgres -c "ALTER USER postgres WITH PASSWORD 'postgres';" 2>/dev/null || \
            psql -h 127.0.0.1 -U "$(whoami)" -d postgres -c "CREATE ROLE postgres WITH LOGIN SUPERUSER PASSWORD 'postgres';"
      - name: Bootstrap canonical Postgres cluster roles
        run: bash scripts/bootstrap-postgres-cluster.sh
      - name: Run migrations
        run: node scripts/migrate.mjs
      - name: Boot dev stack in background
        # `dev-stack-no-infra` (không phải `dev-stack`): job này KHÔNG có Docker
        # (`dev-infra` cần docker compose, không hỗ trợ trên macos-latest runner
        # của GitHub Actions) — Postgres đã được boot qua Homebrew + migrate ở 2
        # step trên, nên bỏ qua `dev-infra`/`dev-migrate` và chỉ launch 4 process.
        run: |
          nohup env E2E_TEST_SEED_ENABLED=1 make dev-stack-no-infra > dev-stack.log 2>&1 &
          echo $! > dev-stack.pid
      - name: Run integration_test files against real stack
        working-directory: frontend
        run: bash tool/run_integration_real.sh
      - name: Stop dev stack
        if: always()
        run: kill "$(cat dev-stack.pid)" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-integration-real-dev-stack-log
          path: dev-stack.log
          if-no-files-found: ignore

  landing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: landing
      - run: npm test -- --run
        working-directory: landing
      - run: npm run lint
        working-directory: landing
      - run: npm run build
        working-directory: landing

  doc-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/check_doc_links.py

  # M0 contract freeze — enum canonical 1 nguồn / 3 runtime, route drift snapshot,
  # company-usage inventory. Xem docs/architecture/plans/2026-08-29-cosa-workspace-canonical/M0-contract-freeze.md
  contract-freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pytest
      - name: Enum generated code in sync
        run: node scripts/gen-contracts.mjs --check
      - name: Route inventory / drift snapshot in sync
        run: python scripts/route_inventory.py --check
      - name: Company usage inventory in sync
        run: python scripts/company_usage_inventory.py --check
      - name: ID model + enum contract tests (python)
        run: PYTHONPATH=packages:. python -m pytest tests/agent/contracts/test_workspace_canonical_enums.py tests/agent/contracts/test_id_model_contract.py -q

  # Part 2C.3 — quét secret rò trong diff + toàn bộ lịch sử git.
  # Cấu hình + allowlist tại .gitleaks.toml (bỏ qua *.example, fixture test).
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "true"

  tenancy-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap canonical database roles and databases
        run: scripts/bootstrap-postgres-cluster.sh
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5433
          PGUSER: postgres
          PGDATABASE: postgres
          PGPASSWORD: postgres
          AGENT_APP_PASSWORD: ci-agent-app
          AGENT_MIGRATOR_PASSWORD: ci-agent-migrator
          COSA_APP_PASSWORD: ci-cosa-app
          COSA_MIGRATOR_PASSWORD: ci-cosa-migrator
          WORKSPACE_APP_PASSWORD: ci-workspace-app
          WORKSPACE_MIGRATOR_PASSWORD: ci-workspace-migrator
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: stable
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: packages/agent/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Encore CLI
        run: |
          curl -L https://encore.dev/install.sh | bash
          echo "$HOME/.encore/bin" >> "$GITHUB_PATH"
      - run: npm ci
        working-directory: services/company
      - name: Apply workspace migrations
        run: node scripts/migrate.mjs
        working-directory: services/company
        env:
          WORKSPACE_MIGRATOR_DATABASE_URL: postgresql://workspace_migrator:ci-workspace-migrator@127.0.0.1:5433/workspace?sslmode=disable
      - name: Workspace-only tenancy isolation gate
        run: make tenancy-check
        env:
          WORKSPACE_DATABASE_URL: postgresql://workspace_app:ci-workspace-app@127.0.0.1:5433/workspace?sslmode=disable

  # Task 10 (audit fix, 2026-08-30) — trước đây job này KHÔNG có Postgres,
  # KHÔNG migrate, KHÔNG cài Encore CLI: `tests/e2e/test_ai_compliance_company_http.py`
  # dùng `httpx.MockTransport` tự viết nên chưa từng cần service/DB thật nào.
  # Giờ `tests/e2e/conftest.py::real_company_service` tự khởi `encore run`
  # thật + seed dữ liệu thật qua HTTP thật vào 1 Company service thật — job
  # này cần đúng hạ tầng mà job `services` ở trên đã dùng (Postgres service
  # container + bootstrap-postgres-cluster.sh + Encore CLI + migrate.mjs).
  ai-compliance-production-gate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      WORKSPACE_DATABASE_URL: postgresql://workspace_app:ci-workspace-app@127.0.0.1:5432/workspace?sslmode=disable
      WORKSPACE_MIGRATOR_DATABASE_URL: postgresql://workspace_migrator:ci-workspace-migrator@127.0.0.1:5432/workspace?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap canonical database roles and databases
        run: scripts/bootstrap-postgres-cluster.sh
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGDATABASE: postgres
          PGPASSWORD: postgres
          AGENT_APP_PASSWORD: ci-agent-app
          AGENT_MIGRATOR_PASSWORD: ci-agent-migrator
          COSA_APP_PASSWORD: ci-cosa-app
          COSA_MIGRATOR_PASSWORD: ci-cosa-migrator
          WORKSPACE_APP_PASSWORD: ci-workspace-app
          WORKSPACE_MIGRATOR_PASSWORD: ci-workspace-migrator
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: stable
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            packages/agent/requirements.txt
            apps/cosa/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Encore CLI
        run: |
          curl -L https://encore.dev/install.sh | bash
          echo "$HOME/.encore/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: |
          pip install --require-hashes -r packages/agent/requirements.txt -r apps/cosa/requirements.txt
          pip install pytest-asyncio
          cd services/company && npm install -g pnpm && pnpm install
          cd ../../frontend && flutter pub get
      - name: Run AI Compliance Production Gate
        run: make ai-compliance-production-gate

  realtime-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: services/realtime_agent/requirements.txt
      # pytest-asyncio thiếu (chỉ có `pytest>=8.0.0`) làm mọi @pytest.mark.asyncio
      # fail cứng "async def functions are not natively supported" — phát
      # hiện khi audit CI thật lần đầu (Phase 6 CI Green Gate).
      - run: pip install -r services/realtime_agent/requirements.txt 'pytest>=8.0.0' pytest-asyncio
      - run: mkdir -p test-results
      - run: PYTHONPATH=. pytest tests -m "not live_provider" -q --junitxml=../../test-results/realtime-agent.xml
        working-directory: services/realtime_agent
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: realtime-agent-test-results
          path: test-results/realtime-agent.xml
          if-no-files-found: error

  services:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # services/ được tách thành 2 Encore app độc lập (2026-08-23): `company`
        # (identity/operations/commercial/finance-legal, chạy local) và `cosa`
        # (tenancy/license/agent-policy, chạy trên VPS) — mỗi app có encore.app
        # riêng nên phải test riêng, không còn `encore test` chung ở services/.
        app: [company, cosa]
    services:
      postgres:
        # db.ts dùng thẳng pg.Pool trỏ tới Postgres thật (không còn qua
        # encore.dev/storage/sqldb's SQLDatabase managed-DB nữa), nên CI phải
        # tự chạy Postgres + tự áp migrations (scripts/migrate.mjs) trước khi
        # `encore test` — xem services/company/scripts/migrate.mjs,
        # services/cosa/scripts/migrate.mjs.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      WORKSPACE_DATABASE_URL: postgresql://workspace_app:ci-workspace-app@127.0.0.1:5432/workspace?sslmode=disable
      WORKSPACE_MIGRATOR_DATABASE_URL: postgresql://workspace_migrator:ci-workspace-migrator@127.0.0.1:5432/workspace?sslmode=disable
      COSA_DATABASE_URL: postgresql://cosa_app:ci-cosa-app@127.0.0.1:5432/cosa?sslmode=disable
      COSA_MIGRATOR_DATABASE_URL: postgresql://cosa_migrator:ci-cosa-migrator@127.0.0.1:5432/cosa?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap canonical database roles and databases
        run: scripts/bootstrap-postgres-cluster.sh
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGDATABASE: postgres
          PGPASSWORD: postgres
          AGENT_APP_PASSWORD: ci-agent-app
          AGENT_MIGRATOR_PASSWORD: ci-agent-migrator
          COSA_APP_PASSWORD: ci-cosa-app
          COSA_MIGRATOR_PASSWORD: ci-cosa-migrator
          WORKSPACE_APP_PASSWORD: ci-workspace-app
          WORKSPACE_MIGRATOR_PASSWORD: ci-workspace-migrator
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Encore CLI
        run: |
          curl -L https://encore.dev/install.sh | bash
          echo "$HOME/.encore/bin" >> "$GITHUB_PATH"
      - run: npm ci
        working-directory: services/${{ matrix.app }}
      - name: Run TypeScript type checking
        run: npm run typecheck
        working-directory: services/${{ matrix.app }}
      - name: Apply database migrations
        run: node scripts/migrate.mjs
        working-directory: services/${{ matrix.app }}
      - name: Run TypeScript service tests (type errors fail the build too)
        run: encore test
        working-directory: services/${{ matrix.app }}

  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            packages/agent/requirements.txt
            apps/cosa/requirements.txt
      - run: |
          pip install --require-hashes -r packages/agent/requirements.txt -r apps/cosa/requirements.txt
          pip install -r requirements-dev.txt
      - run: ruff check packages/agent apps/cosa packages/agent_integrations
      - run: ruff format --check packages/agent apps/cosa packages/agent_integrations
      - run: mypy

  python-dependency-audit:
    # Task 10 (truthful-mvp-hardening) — dependency resolution phải lặp lại
    # được (lock + hash) và không âm thầm trôi khỏi requirements.in. Job này
    # KHÔNG thay pip install --require-hashes ở các job khác — nó chỉ xác
    # nhận lock hiện tại còn khớp input và không có lỗ hổng đã biết.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install pip-tools pip-audit
      - name: Verify committed locks match requirements.in (no silent drift)
        run: |
          pip-compile --generate-hashes --allow-unsafe -o packages/agent/requirements.txt packages/agent/requirements.in
          pip-compile --generate-hashes --allow-unsafe -o apps/cosa/requirements.txt apps/cosa/requirements.in
          git diff --exit-code packages/agent/requirements.txt apps/cosa/requirements.txt
      - name: Audit locked dependencies for known vulnerabilities
        run: |
          pip-audit -r packages/agent/requirements.txt --require-hashes
          pip-audit -r apps/cosa/requirements.txt --require-hashes

