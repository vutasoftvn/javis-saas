name: quality

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: stable
          cache: true
      - run: flutter pub get
        working-directory: frontend
      - run: mkdir -p ../test-results
        working-directory: frontend
      - run: flutter test --machine > ../test-results/frontend.json
        working-directory: frontend
      - run: flutter analyze
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-test-results
          path: test-results/frontend.json
          if-no-files-found: error

  landing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: landing
      - run: npm run lint
        working-directory: landing
      - run: npm run build
        working-directory: landing

  doc-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/check_doc_links.py

  # M0 contract freeze — enum canonical 1 nguồn / 3 runtime, route drift snapshot,
  # company-usage inventory. Xem docs/architecture/plans/2026-08-29-cosa-workspace-canonical/M0-contract-freeze.md
  contract-freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pytest
      - name: Enum generated code in sync
        run: node scripts/gen-contracts.mjs --check
      - name: Route inventory / drift snapshot in sync
        run: python scripts/route_inventory.py --check
      - name: Company usage inventory in sync
        run: python scripts/company_usage_inventory.py --check
      - name: ID model + enum contract tests (python)
        run: PYTHONPATH=packages:. python -m pytest tests/agent_core/contracts/test_workspace_canonical_enums.py tests/agent_core/contracts/test_id_model_contract.py -q

  # Part 2C.3 — quét secret rò trong diff + toàn bộ lịch sử git.
  # Cấu hình + allowlist tại .gitleaks.toml (bỏ qua *.example, fixture test).
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "true"

  tenancy-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cosa
          POSTGRES_PASSWORD: cosa
          POSTGRES_DB: company
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U cosa"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: stable
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: packages/agent_core/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Encore CLI
        run: |
          curl -L https://encore.dev/install.sh | bash
          echo "$HOME/.encore/bin" >> "$GITHUB_PATH"
      - name: Workspace-only tenancy isolation gate
        run: make tenancy-check
        env:
          COMPANY_DATABASE_URL: postgresql://cosa:cosa@127.0.0.1:5433/company?sslmode=disable
          AGENT_CORE_TEST_DATABASE_URL: postgresql+asyncpg://javis:javis@127.0.0.1:5432/javis_test
          CONTROL_PLANE_TEST_DATABASE_URL: postgresql://cosa:cosa@127.0.0.1:5433/cosa?sslmode=disable

  realtime-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: services/realtime_agent/requirements.txt
      # pytest-asyncio thiếu (chỉ có `pytest>=8.0.0`) làm mọi @pytest.mark.asyncio
      # fail cứng "async def functions are not natively supported" — phát
      # hiện khi audit CI thật lần đầu (Phase 6 CI Green Gate).
      - run: pip install -r services/realtime_agent/requirements.txt 'pytest>=8.0.0' pytest-asyncio
      - run: mkdir -p test-results
      - run: PYTHONPATH=. pytest tests -m "not live_provider" -q --junitxml=../../test-results/realtime-agent.xml
        working-directory: services/realtime_agent
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: realtime-agent-test-results
          path: test-results/realtime-agent.xml
          if-no-files-found: error

  services:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # services/ được tách thành 2 Encore app độc lập (2026-08-23): `company`
        # (identity/operations/commercial/finance-legal, chạy local) và `cosa`
        # (tenancy/license/agent-policy, chạy trên VPS) — mỗi app có encore.app
        # riêng nên phải test riêng, không còn `encore test` chung ở services/.
        app: [company, cosa]
    services:
      postgres:
        # db.ts dùng thẳng pg.Pool trỏ tới Postgres thật (không còn qua
        # encore.dev/storage/sqldb's SQLDatabase managed-DB nữa), nên CI phải
        # tự chạy Postgres + tự áp migrations (scripts/migrate.mjs) trước khi
        # `encore test` — xem services/company/scripts/migrate.mjs,
        # services/cosa/scripts/migrate.mjs.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cosa
          POSTGRES_PASSWORD: cosa
          POSTGRES_DB: ${{ matrix.app }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cosa"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      COMPANY_DATABASE_URL: postgresql://cosa:cosa@127.0.0.1:5432/${{ matrix.app }}?sslmode=disable
      COSA_DATABASE_URL: postgresql://cosa:cosa@127.0.0.1:5432/${{ matrix.app }}?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Encore CLI
        run: |
          curl -L https://encore.dev/install.sh | bash
          echo "$HOME/.encore/bin" >> "$GITHUB_PATH"
      - run: npm ci
        working-directory: services/${{ matrix.app }}
      - name: Run TypeScript type checking
        run: npm run typecheck
        working-directory: services/${{ matrix.app }}
      - name: Apply database migrations
        run: node scripts/migrate.mjs
        working-directory: services/${{ matrix.app }}
      - name: Run TypeScript service tests (type errors fail the build too)
        run: encore test
        working-directory: services/${{ matrix.app }}

  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            packages/agent_core/requirements.txt
            apps/cosa/requirements.txt
      - run: pip install -r requirements-dev.txt -r packages/agent_core/requirements.txt -r apps/cosa/requirements.txt
      - run: ruff check packages/agent_core apps/cosa packages/agent_integrations
      - run: ruff format --check packages/agent_core apps/cosa packages/agent_integrations
      - run: mypy

  quality-unit:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: javis
          POSTGRES_PASSWORD: javis
          POSTGRES_DB: javis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U javis -d javis_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            packages/agent_core/requirements.txt
      - run: pip install -r requirements-dev.txt -r packages/agent_core/requirements.txt pytest pytest-asyncio
      - name: Validate skillpack contracts
        run: PYTHONPATH=packages:. python scripts/validate_skillpacks.py
      - name: Run skillpack contract tests
        run: PYTHONPATH=packages:. python -m pytest tests/agent_core/skills/test_skillpack_contract.py -q
      - run: mkdir -p test-results
      - run: PYTHONPATH=packages:. pytest tests/agent_core packages/agent_testkit -m "not integration" --cov=packages/agent_core --cov-report=xml:test-results/coverage-unit.xml --cov-fail-under=80 -q --junitxml=test-results/unit.xml
        env:
          DATABASE_URL: postgresql://javis:javis@127.0.0.1:5432/javis_test
          AGENT_CORE_TEST_DATABASE_URL: postgresql+asyncpg://javis:javis@127.0.0.1:5432/javis_test
          PLATFORM_JWT_SECRET: cosa-super-secret-platform-jwt-key-change-in-prod
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-unit-test-results
          path: |
            test-results/unit.xml
            test-results/coverage-unit.xml
          if-no-files-found: error

  quality-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: javis
          POSTGRES_PASSWORD: javis
          POSTGRES_DB: javis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U javis -d javis_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            packages/agent_core/requirements.txt
            apps/cosa/requirements.txt
      - run: pip install -r requirements-dev.txt -r packages/agent_core/requirements.txt -r apps/cosa/requirements.txt pytest pytest-asyncio
      - name: Apply agent_core database migrations
        run: PYTHONPATH=. python -m packages.agent_core.scripts.migrate
        env:
          DATABASE_URL: postgresql://javis:javis@127.0.0.1:5432/javis_test
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Encore CLI
        run: |
          curl -L https://encore.dev/install.sh | bash
          echo "$HOME/.encore/bin" >> "$GITHUB_PATH"
      - run: npm ci
        working-directory: services/cosa
      - name: Apply services/cosa (control-plane) database migrations
        run: node scripts/migrate.mjs
        working-directory: services/cosa
        env:
          COSA_DATABASE_URL: postgresql://javis:javis@127.0.0.1:5432/javis_test?sslmode=disable
      - run: mkdir -p test-results
      # Integration tests with deterministic (fake) model — no real API key needed
      - run: PYTHONPATH=. pytest tests/agent_core tests/apps/cosa -m "integration and not live_provider and not durability" --cov=packages/agent_core --cov=apps/cosa --cov-report=xml:test-results/coverage-integration.xml --cov-fail-under=80 -q --junitxml=test-results/integration.xml
        env:
          DATABASE_URL: postgresql://javis:javis@127.0.0.1:5432/javis_test
          AGENT_CORE_TEST_DATABASE_URL: postgresql+asyncpg://javis:javis@127.0.0.1:5432/javis_test
          AGENT_CORE_DATABASE_URL: postgresql+asyncpg://javis:javis@127.0.0.1:5432/javis_test
          CONTROL_PLANE_DATABASE_URL: postgresql://javis:javis@127.0.0.1:5432/javis_test
          CONTROL_PLANE_TEST_DATABASE_URL: postgresql://javis:javis@127.0.0.1:5432/javis_test
          COSA_DATABASE_URL: postgresql://javis:javis@127.0.0.1:5432/javis_test?sslmode=disable
          PLATFORM_JWT_SECRET: cosa-super-secret-platform-jwt-key-change-in-prod
          WORKER_SERVICE_JWT_SECRET: cosa-worker-service-jwt-key-change-in-prod-min32chars
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-integration-test-results
          path: |
            test-results/integration.xml
            test-results/coverage-integration.xml
          if-no-files-found: error

  durability:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: javis
          POSTGRES_PASSWORD: javis
          POSTGRES_DB: javis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U javis -d javis_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            packages/agent_core/requirements.txt
            apps/cosa/requirements.txt
      - run: pip install -r requirements-dev.txt -r packages/agent_core/requirements.txt -r apps/cosa/requirements.txt pytest pytest-asyncio
      - name: Apply agent_core database migrations
        run: PYTHONPATH=. python -m packages.agent_core.scripts.migrate
        env:
          DATABASE_URL: postgresql://javis:javis@127.0.0.1:5432/javis_test
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Encore CLI
        run: |
          curl -L https://encore.dev/install.sh | bash
          echo "$HOME/.encore/bin" >> "$GITHUB_PATH"
      - run: npm ci
        working-directory: services/cosa
      - name: Apply services/cosa (control-plane) database migrations
        run: node scripts/migrate.mjs
        working-directory: services/cosa
        env:
          COSA_DATABASE_URL: postgresql://javis:javis@127.0.0.1:5432/javis_test?sslmode=disable
      - run: mkdir -p test-results
      - name: Run cross-process crash recovery and lease mutual exclusion durability tests
        run: PYTHONPATH=. pytest tests/apps/cosa/worker -m "durability" -q --junitxml=test-results/durability.xml
        env:
          DATABASE_URL: postgresql://javis:javis@127.0.0.1:5432/javis_test
          AGENT_CORE_TEST_DATABASE_URL: postgresql+asyncpg://javis:javis@127.0.0.1:5432/javis_test
          AGENT_CORE_DATABASE_URL: postgresql+asyncpg://javis:javis@127.0.0.1:5432/javis_test
          CONTROL_PLANE_DATABASE_URL: postgresql://javis:javis@127.0.0.1:5432/javis_test
          CONTROL_PLANE_TEST_DATABASE_URL: postgresql://javis:javis@127.0.0.1:5432/javis_test
          COSA_DATABASE_URL: postgresql://javis:javis@127.0.0.1:5432/javis_test?sslmode=disable
          PLATFORM_JWT_SECRET: cosa-super-secret-platform-jwt-key-change-in-prod
          WORKER_SERVICE_JWT_SECRET: cosa-worker-service-jwt-key-change-in-prod-min32chars
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: durability-test-results
          path: test-results/durability.xml
          if-no-files-found: error

  schema-fingerprint:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: javis
          POSTGRES_PASSWORD: javis
          POSTGRES_DB: javis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U javis -d javis_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            packages/agent_core/requirements.txt
            requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r packages/agent_core/requirements.txt
      - run: npm ci
        working-directory: services/cosa
      - run: npm ci
        working-directory: services/company
      - name: Verify Expand-Contract backward compatibility
        run: node scripts/check-migration-backward-compat.mjs
      - name: Apply all database migrations
        run: make migrate-all
        env:
          AGENT_CORE_DATABASE_URL: postgresql+asyncpg://javis:javis@127.0.0.1:5432/javis_test
          DATABASE_URL: postgresql://javis:javis@127.0.0.1:5432/javis_test
          COSA_DATABASE_URL: postgresql://javis:javis@127.0.0.1:5432/javis_test?sslmode=disable
          CONTROL_PLANE_DATABASE_URL: postgresql://javis:javis@127.0.0.1:5432/javis_test?sslmode=disable
          COMPANY_DATABASE_URL: postgresql://javis:javis@127.0.0.1:5432/javis_test?sslmode=disable
      - name: Verify schema fingerprint (Migration Gate D)
        run: node scripts/schema-fingerprint.mjs --check
        env:
          AGENT_CORE_DATABASE_URL: postgresql+asyncpg://javis:javis@127.0.0.1:5432/javis_test
          DATABASE_URL: postgresql://javis:javis@127.0.0.1:5432/javis_test
          COSA_DATABASE_URL: postgresql://javis:javis@127.0.0.1:5432/javis_test?sslmode=disable
          CONTROL_PLANE_DATABASE_URL: postgresql://javis:javis@127.0.0.1:5432/javis_test?sslmode=disable
          COMPANY_DATABASE_URL: postgresql://javis:javis@127.0.0.1:5432/javis_test?sslmode=disable

  migration-rollback:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.base_ref == 'main' || github.event_name == 'workflow_dispatch'
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: javis
          POSTGRES_PASSWORD: javis
          POSTGRES_DB: javis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U javis -d javis_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            packages/agent_core/requirements.txt
            requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r packages/agent_core/requirements.txt
      - run: npm ci
        working-directory: services/cosa
      - run: npm ci
        working-directory: services/company
      - name: Verify Migration Rollback Roundtrip (Migration Gate E)
        run: node scripts/test-migration-rollback.mjs --steps 5
        env:
          PYTHON: python3
          AGENT_CORE_DATABASE_URL: postgresql+asyncpg://javis:javis@127.0.0.1:5432/javis_test
          DATABASE_URL: postgresql://javis:javis@127.0.0.1:5432/javis_test
          COSA_DATABASE_URL: postgresql://javis:javis@127.0.0.1:5432/javis_test?sslmode=disable
          CONTROL_PLANE_DATABASE_URL: postgresql://javis:javis@127.0.0.1:5432/javis_test?sslmode=disable
          COMPANY_DATABASE_URL: postgresql://javis:javis@127.0.0.1:5432/javis_test?sslmode=disable

  quality-live-provider:
    runs-on: ubuntu-latest
    # Only run live-provider tests on protected branches or explicit trigger
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: javis
          POSTGRES_PASSWORD: javis
          POSTGRES_DB: javis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U javis -d javis_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            packages/agent_core/requirements.txt
            apps/cosa/requirements.txt
      - run: pip install -r packages/agent_core/requirements.txt -r apps/cosa/requirements.txt pytest pytest-asyncio
      - name: Apply agent_core database migrations
        run: PYTHONPATH=. python -m packages.agent_core.scripts.migrate
        env:
          DATABASE_URL: postgresql://javis:javis@127.0.0.1:5432/javis_test
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Encore CLI
        run: |
          curl -L https://encore.dev/install.sh | bash
          echo "$HOME/.encore/bin" >> "$GITHUB_PATH"
      - run: npm ci
        working-directory: services/cosa
      - name: Apply services/cosa (control-plane) database migrations
        run: node scripts/migrate.mjs
        working-directory: services/cosa
        env:
          COSA_DATABASE_URL: postgresql://javis:javis@127.0.0.1:5432/javis_test?sslmode=disable
      - run: mkdir -p test-results
      # Live-provider tests requiring real DEEPSEEK_API_KEY
      - run: PYTHONPATH=. pytest tests/agent_core tests/apps/cosa packages/agent_testkit -m live_provider -q --junitxml=test-results/live-provider.xml
        env:
          DATABASE_URL: postgresql://javis:javis@127.0.0.1:5432/javis_test
          AGENT_CORE_TEST_DATABASE_URL: postgresql+asyncpg://javis:javis@127.0.0.1:5432/javis_test
          AGENT_CORE_DATABASE_URL: postgresql+asyncpg://javis:javis@127.0.0.1:5432/javis_test
          CONTROL_PLANE_DATABASE_URL: postgresql://javis:javis@127.0.0.1:5432/javis_test
          CONTROL_PLANE_TEST_DATABASE_URL: postgresql://javis:javis@127.0.0.1:5432/javis_test
          COSA_DATABASE_URL: postgresql://javis:javis@127.0.0.1:5432/javis_test?sslmode=disable
          PLATFORM_JWT_SECRET: cosa-super-secret-platform-jwt-key-change-in-prod
          WORKER_SERVICE_JWT_SECRET: cosa-worker-service-jwt-key-change-in-prod-min32chars
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-live-provider-test-results
          path: test-results/live-provider.xml
          if-no-files-found: error

  desktop-worker-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: packages/agent_core/requirements.txt
      - run: pip install -r packages/agent_core/requirements.txt pytest pytest-asyncio pyyaml
      - run: mkdir -p test-results
      - run: PYTHONPATH=. pytest tests/desktop_worker -q --junitxml=test-results/desktop-worker.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-worker-test-results
          path: test-results/desktop-worker.xml
          if-no-files-found: error

  boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: packages/agent_core/requirements.txt
      - run: pip install -r packages/agent_core/requirements.txt pytest pytest-asyncio
      - run: make boundary-check

  e2e-golden-path:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.base_ref == 'main' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            packages/agent_core/requirements.txt
            apps/cosa/requirements.txt
      - run: pip install -r requirements-dev.txt -r packages/agent_core/requirements.txt -r apps/cosa/requirements.txt pytest pytest-asyncio httpx pyjwt
      - name: Run E2E Golden Path test suite
        run: bash scripts/e2e/run-golden-path.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-test-results
          path: test-results/e2e.xml
          if-no-files-found: error

