name: quality

on:
  push:
  pull_request:

jobs:
  agentos:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: javis
          POSTGRES_PASSWORD: javis
          POSTGRES_DB: javis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U javis -d javis_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: agentos/requirements.txt
      - run: pip install -r agentos/requirements.txt
      - run: mkdir -p test-results
      - run: PYTHONPATH=. pytest tests/agentos -q --junitxml=test-results/agentos.xml
        env:
          DATABASE_URL: postgresql://javis:javis@127.0.0.1:5432/javis_test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agentos-test-results
          path: test-results/agentos.xml
          if-no-files-found: error

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: stable
          cache: true
      - run: flutter pub get
        working-directory: frontend
      - run: mkdir -p ../test-results
        working-directory: frontend
      - run: flutter test --machine > ../test-results/frontend.json
        working-directory: frontend
      - run: flutter analyze
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-test-results
          path: test-results/frontend.json
          if-no-files-found: error

  realtime-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: services/realtime_agent/requirements.txt
      - run: pip install -r services/realtime_agent/requirements.txt 'pytest>=8.0.0'
      - run: mkdir -p test-results
      - run: pytest tests -q --junitxml=../../test-results/realtime-agent.xml
        working-directory: services/realtime_agent
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: realtime-agent-test-results
          path: test-results/realtime-agent.xml
          if-no-files-found: error

  boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make boundary-check
