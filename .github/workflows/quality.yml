name: quality

on:
  push:
  pull_request:

jobs:
  agent-core:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: javis
          POSTGRES_PASSWORD: javis
          POSTGRES_DB: javis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U javis -d javis_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: packages/agent_core/requirements.txt
      # pytest/pytest-asyncio không phải runtime dependency của agent_core
      # (không thuộc packages/agent_core/requirements.txt có chủ đích — xem
      # comment trong pyproject.toml cùng thư mục) nên cài riêng ở đây; cần
      # pytest-asyncio vì pytest.ini khai `asyncio_mode = strict`.
      - run: pip install -r packages/agent_core/requirements.txt pytest pytest-asyncio
      - run: mkdir -p test-results
      - run: PYTHONPATH=. pytest tests/agent_core packages/agent_testkit -q --junitxml=test-results/agent-core.xml
        env:
          DATABASE_URL: postgresql://javis:javis@127.0.0.1:5432/javis_test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-core-test-results
          path: test-results/agent-core.xml
          if-no-files-found: error

  apps-cosa:
    # Trước đây tests/apps/cosa CHỈ chạy 1 phần (2 test boundary-check qua
    # job `boundaries`) — toàn bộ auth/policies/worker/event_stream/vertical-
    # slice/tenant-isolation test (Phase 2-5,
    # COSA_FINAL_INTEGRATION_AND_LEGACY_EXIT_PLAN_2026-08-25.md §19.2/§29.6
    # Phase 9) chưa từng chạy trong CI, chỉ tồn tại trong repo. Dùng Python
    # 3.11 thật (không cần eval_type_backport shim như môi trường dev cục bộ
    # chỉ có Python 3.9).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: javis
          POSTGRES_PASSWORD: javis
          POSTGRES_DB: javis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U javis -d javis_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            packages/agent_core/requirements.txt
            apps/cosa/requirements.txt
      - run: pip install -r packages/agent_core/requirements.txt -r apps/cosa/requirements.txt pytest pytest-asyncio
      - run: mkdir -p test-results
      - run: PYTHONPATH=. pytest tests/apps/cosa -q --junitxml=test-results/apps-cosa.xml
        env:
          DATABASE_URL: postgresql://javis:javis@127.0.0.1:5432/javis_test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apps-cosa-test-results
          path: test-results/apps-cosa.xml
          if-no-files-found: error

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: stable
          cache: true
      - run: flutter pub get
        working-directory: frontend
      - run: mkdir -p ../test-results
        working-directory: frontend
      - run: flutter test --machine > ../test-results/frontend.json
        working-directory: frontend
      - run: flutter analyze
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-test-results
          path: test-results/frontend.json
          if-no-files-found: error

  realtime-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: services/realtime_agent/requirements.txt
      - run: pip install -r services/realtime_agent/requirements.txt 'pytest>=8.0.0'
      - run: mkdir -p test-results
      - run: pytest tests -q --junitxml=../../test-results/realtime-agent.xml
        working-directory: services/realtime_agent
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: realtime-agent-test-results
          path: test-results/realtime-agent.xml
          if-no-files-found: error

  services:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # services/ được tách thành 2 Encore app độc lập (2026-08-23): `company`
        # (identity/operations/commercial/finance-legal, chạy local) và `cosa`
        # (tenancy/license/agent-policy, chạy trên VPS) — mỗi app có encore.app
        # riêng nên phải test riêng, không còn `encore test` chung ở services/.
        app: [company, cosa]
    services:
      postgres:
        # db.ts dùng thẳng pg.Pool trỏ tới Postgres thật (không còn qua
        # encore.dev/storage/sqldb's SQLDatabase managed-DB nữa), nên CI phải
        # tự chạy Postgres + tự áp migrations (scripts/migrate.mjs) trước khi
        # `encore test` — xem services/company/scripts/migrate.mjs,
        # services/cosa/scripts/migrate.mjs.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cosa
          POSTGRES_PASSWORD: cosa
          POSTGRES_DB: ${{ matrix.app }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cosa"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      COMPANY_DATABASE_URL: postgresql://cosa:cosa@127.0.0.1:5432/${{ matrix.app }}?sslmode=disable
      COSA_DATABASE_URL: postgresql://cosa:cosa@127.0.0.1:5432/${{ matrix.app }}?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Encore CLI
        run: |
          curl -L https://encore.dev/install.sh | bash
          echo "$HOME/.encore/bin" >> "$GITHUB_PATH"
      - run: npm install
        working-directory: services/${{ matrix.app }}
      - name: Apply database migrations
        run: node scripts/migrate.mjs
        working-directory: services/${{ matrix.app }}
      - name: Run TypeScript service tests (type errors fail the build too)
        run: encore test
        working-directory: services/${{ matrix.app }}

  boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make boundary-check
