# Ánh xạ feature/integration/recipe → code owner → canonical doc → tests.
# Theo COSA_AGENT_PLATFORM_IMPLEMENTATION_BLUEPRINT_V2_2026-08-24.md §66 (documentation-as-code)
# và COSA_AGENT_PLATFORM_BLUEPRINT_V2_RECONCILED_PLAN_2026-08-24.md Phần J.
#
# Quy tắc điền:
# - Mỗi feature/package production mới PHẢI có 1 entry ở đây trước khi CI documentation gate được bật
#   (gate chỉ bật sau khi entries đã phủ hết feature hiện có — xem Phần J, chưa bật trong phiên này).
# - `doc` phải trỏ tới file thật đã tồn tại (docs/features/<id>.md, docs/integrations/<id>.md, docs/recipes/<id>.md).
# - `tests` liệt kê đường dẫn test chính (không cần liệt kê hết, chỉ cần đủ để tìm lại).
# - `status`: draft | active | deprecated.

