apiVersion: agentos.ai/v1
kind: Skill
metadata:
  id: commercial.launch
  name: Product Launch Checklist & Go-To-Market Readiness Gate
  version: 1.0.1
  description: Quản lý quy trình ra mắt sản phẩm (GTM Launch), thiết lập các cổng
    kiểm tra sẵn sàng (Readiness Gates), kịch bản ngày ra mắt và đánh giá hậu ra mắt.
publisher:
  name: cosa
  type: official
source:
  type: local
  path: skillpacks/commercial/launch
capability:
  domain: commercial
  category: launch
  intents:
  - product launch
  - go to market checklist
  - readiness gate
  - launch day runbook
  - post launch review
  - gtm execution
runtime:
  entrypoint: SKILL.md
  tools: []
permissions:
  required:
  - READ_LOCAL
risk:
  level: low
trust:
  tier: T0
applicability:
  project_stages:
  - P3_BUILD_VALIDATE
  - P4_GO_TO_MARKET
  - P5_OPERATE_GROWTH
  gates:
  - G3
  - G4
  - G5
  required_context:
  - workspace
  - project
  outputs:
  - artifact
  - proposal
autonomy:
  ceiling: L1_PROPOSE
  side_effect_class: A
evidence:
  min_source_refs: 1
  self_validation_forbidden: true
quality:
  eval_suite: evals/commercial/launch.yaml
  required_negative_cases:
  - missing-workspace
  - cross-workspace
  - missing-readiness-evidence
