  category: churn_analysis
  intents:
  - churn analysis
  - phan tich roi bo
  - nguyen nhan khach huy
  - exit interview
  - churn audit
runtime:
  environment: python
  entrypoint: SKILL.md
  tools:
  - strategy.evidence.create
  - analytics.metric_contract.get
permissions:
  required:
  - READ_LOCAL
  - WRITE_LOCAL
risk:
  level: low
trust:
  tier: T0
applicability:
  project_stages:
  - P4_GO_TO_MARKET
  - P5_OPERATE_GROWTH
  - P6_SCALE_GOVERN
  gates:
  - G4
  - G5
  - G6
  required_context:
  - workspace
  - project
  outputs:
  - artifact
  - proposal
autonomy:
  ceiling: L1_PROPOSE
  side_effect_class: A
evidence:
  min_source_refs: 1
  self_validation_forbidden: true
quality:
  eval_suite: evals/customer-success/churn-analysis.yaml
  required_negative_cases:
  - missing-workspace
  - cross-workspace
  - unsourced-churn-cause
