apiVersion: agentos.ai/v1
kind: Skill
metadata:
  id: customer-success.churn-analysis
  name: Churn Root Cause Analysis
  version: 1.0.1
  description: Phân tích nguyên nhân gốc rễ khách hàng ngừng sử dụng và tổng hợp bằng
    chứng phục vụ cải tiến sản phẩm và chiến lược giữ chân.
publisher:
  name: cosa
  type: official
source:
  type: local
  path: skillpacks/customer-success/churn-analysis
capability:
