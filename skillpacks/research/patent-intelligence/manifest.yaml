apiVersion: agentos.ai/v1
kind: Skill

metadata:
  id: research.patent-intelligence
  name: Patent Prior-Art, FTO & Technology Landscape Intelligence
  version: 1.0.0
  description: Tình báo sáng chế và giải pháp kỹ thuật có trước (Prior Art), phân tích tự do triển khai (Freedom-to-Operate) và bản đồ sáng chế công nghệ theo phân loại CPC, kèm tuyên bố miễn trừ tư vấn pháp lý.

publisher:
  name: cosa
  type: official

source:
  type: local
  path: skillpacks/research/patent-intelligence

capability:
  domain: research
  category: patent-intelligence
  intents:
    - patent search
    - prior art search
    - freedom to operate
    - fto analysis
    - patent landscape
    - cpc classification
    - tra cứu sáng chế

runtime:
  entrypoint: SKILL.md
  tools:
    - web.search

applicability:
  project_stages:
    - P1_PROBLEM_VALIDATION
    - P2_SOLUTION_VALIDATION
    - P3_BUILD_VALIDATE
  gates:
    - G1
    - G2
    - G3
  required_context:
    - workspace
    - project
  outputs:
    - artifact
    - proposal

autonomy:
  ceiling: L0_OBSERVE
  side_effect_class: R

evidence:
  min_source_refs: 2
  self_validation_forbidden: true

quality:
  eval_suite: evals/research/patent-intelligence.yaml
  required_negative_cases:
    - missing-workspace
    - missing-legal-disclaimer
    - out-of-scope-trademark

permissions:
  required:
    - READ_LOCAL

risk:
  level: low

trust:
  tier: T0
