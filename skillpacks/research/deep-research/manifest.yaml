apiVersion: agentos.ai/v1
kind: Skill

metadata:
  id: research.deep-research
  name: Deep Research, Evidence Synthesis & Citation Brief
  version: 1.0.0
  description: Nghiên cứu chuyên sâu đa nguồn, tổng hợp trích dẫn có kiểm chứng, phân tích mâu thuẫn thông tin và nhận diện khoảng trống nghiên cứu.

publisher:
  name: javis
  type: official

source:
  type: local
  path: skillpacks/research/deep-research

capability:
  domain: research
  category: synthesis
  intents:
    - deep research
    - nghiên cứu chuyên sâu
    - research brief
    - citation synthesis
    - contradiction analysis
    - knowledge gap analysis

runtime:
  entrypoint: SKILL.md
  tools:
    - web.search

applicability:
  project_stages:
    - P0_DISCOVERY
    - P1_PROBLEM_VALIDATION
    - P2_SOLUTION_VALIDATION
  gates:
    - G0
    - G1
    - G2
  required_context:
    - workspace
    - project
  outputs:
    - artifact

autonomy:
  ceiling: L0_OBSERVE
  side_effect_class: R

evidence:
  min_source_refs: 0
  self_validation_forbidden: true

quality:
  eval_suite: evals/research/deep-research.yaml
  required_negative_cases:
    - missing-workspace
    - cross-workspace

permissions:
  required:
    - READ_LOCAL

risk:
  level: low

trust:
  tier: T0
