  name: Alpha Validation & Sanity Checklist
  version: 1.0.0
  description: Kế hoạch kiểm thử nội bộ, danh mục kiểm tra độ ổn định (Sanity/Regression) trước khi bàn giao cho Release Owner.
publisher:
  name: cosa
  type: official
source:
