apiVersion: agentos.ai/v1
kind: Skill
metadata:
  id: engineering.workspace-site-builder
  name: Workspace Website, Form & Commerce Builder (Sandbox Execution)
  version: 1.0.0
  description: Kỹ năng chuyên biệt cho CTO Agent chỉ đạo và điều phối xây dựng website đa trang, landing page, form/khảo sát tương tác và cửa hàng thương mại điện tử trong môi trường Sandbox cô lập, sau đó phát hành lên subdomain hoặc domain riêng của Workspace.
publisher:
  name: cosa
  type: official
source:
  type: local
  path: skillpacks/engineering/workspace-site-builder
capability:
  domain: engineering
  category: engineering
  intents:
  - workspace site builder
  - sandbox web app generator
  - survey form builder
  - ecommerce storefront generator
  - subdomain deploy
runtime:
  entrypoint: SKILL.md
  tools: []
permissions:
  required:
  - READ_LOCAL
risk:
  level: low
trust:
  tier: T0
applicability:
  project_stages:
  - P3_BUILD_VALIDATE
  - P4_GO_TO_MARKET
  - P5_OPERATE_GROWTH
  - P6_SCALE_GOVERN
  gates:
  - G3
  - G4
  - G5
  - G6
  required_context:
  - workspace
  - project
  outputs:
  - proposal
  - artifact
autonomy:
  ceiling: L1_PROPOSE
  side_effect_class: A
evidence:
  min_source_refs: 1
  self_validation_forbidden: true
quality:
  eval_suite: evals/engineering/workspace-site-builder.yaml
  required_negative_cases:
  - missing-workspace
  - cross-workspace
  - autonomous-deploy
