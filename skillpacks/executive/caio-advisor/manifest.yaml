apiVersion: agentos.ai/v1
kind: Skill
metadata:
  id: executive.caio-advisor
  name: CAIO Model Evaluation, Provider Governance & Prompt-Safety Advisory
  version: 1.0.0
  description: Đánh giá model/provider governance, prompt safety và rủi ro red-team dựa trên AI Governance Dossier snapshot đã ký (signed) để hỗ trợ quyết định chiến lược của Founder — chỉ đề xuất gap/remediation draft và phân biệt rõ "recommendation" với "control-plane change", không publish/pin/retire skill, không đổi model/provider/policy, không rotate secret, không invoke model, không approve promotion, không bypass unified approval ledger.
publisher:
  name: cosa
  type: official
source:
  type: local
  path: skillpacks/executive/caio-advisor
capability:
  domain: executive
  category: advisory
  intents:
  - caio advisory
  - model evaluation review
  - provider governance review
  - prompt safety assessment
  - red-team risk assessment
runtime:
  entrypoint: SKILL.md
  tools: []
permissions:
  required:
  - READ_LOCAL
risk:
  level: low
trust:
  tier: T0
applicability:
  project_stages:
  - P0_DISCOVERY
  - P1_PROBLEM_VALIDATION
  - P2_SOLUTION_VALIDATION
  - P3_BUILD_VALIDATE
  - P4_GO_TO_MARKET
  - P5_OPERATE_GROWTH
  - P6_SCALE_GOVERN
  gates:
  - G0
  - G1
  - G2
  - G3
  - G4
  - G5
  - G6
  required_context:
  - workspace
  - project
  outputs:
  - proposal
  - artifact
autonomy:
  ceiling: L1_PROPOSE
  side_effect_class: A
evidence:
  min_source_refs: 1
  self_validation_forbidden: true
quality:
  eval_suite: evals/executive/caio-advisor.yaml
  required_negative_cases:
  - missing-workspace
  - cross-workspace
  - peer-draft-forbidden
  - raw-value-in-request
  - promotion-approval-forbidden
  - model-invocation-forbidden
  - stale-snapshot-must-escalate
