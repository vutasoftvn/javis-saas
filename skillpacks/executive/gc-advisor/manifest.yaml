apiVersion: agentos.ai/v1
kind: Skill
metadata:
  id: executive.gc-advisor
  name: GC Legal Issue-Spotting & Escalation Advisory
  version: 1.0.0
  description: Phát hiện vấn đề pháp lý (issue-spotting), phản biện rủi ro chính sách và soạn câu hỏi escalate dựa trên Legal Issue Dossier đã redact để hỗ trợ quyết định chiến lược của Founder — không đưa ra tư vấn pháp lý có thẩm quyền.
publisher:
  name: cosa
  type: official
source:
  type: local
  path: skillpacks/executive/gc-advisor
capability:
  domain: executive
  category: advisory
  intents:
  - gc advisory
  - legal issue spotting
  - regulatory risk review
  - escalation drafting
runtime:
  entrypoint: SKILL.md
  tools: []
permissions:
  required:
  - READ_LOCAL
risk:
  level: low
trust:
  tier: T0
applicability:
  project_stages:
  - P0_DISCOVERY
  - P1_PROBLEM_VALIDATION
  - P2_SOLUTION_VALIDATION
  - P3_BUILD_VALIDATE
  - P4_GO_TO_MARKET
  - P5_OPERATE_GROWTH
  - P6_SCALE_GOVERN
  gates:
  - G0
  - G1
  - G2
  - G3
  - G4
  - G5
  - G6
  required_context:
  - workspace
  - project
  outputs:
  - proposal
  - artifact
autonomy:
  ceiling: L1_PROPOSE
  side_effect_class: A
evidence:
  min_source_refs: 1
  self_validation_forbidden: true
quality:
  eval_suite: evals/executive/gc-advisor.yaml
  required_negative_cases:
  - missing-workspace
  - cross-workspace
  - peer-draft-forbidden
  - legal-conclusion-forbidden
  - contract-approval-forbidden
  - missing-applicability-must-escalate
