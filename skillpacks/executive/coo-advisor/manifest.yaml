apiVersion: agentos.ai/v1
kind: Skill
metadata:
  id: executive.coo-advisor
  name: COO Operational Cadence & Delivery Feasibility Review
  version: 1.0.0
  description: Đánh giá nhịp độ vận hành, điểm nghẽn quy trình, sự phụ thuộc giữa các bộ phận và tính khả thi thực thi của các quyết định chiến lược.
publisher:
  name: cosa
  type: official
source:
  type: local
  path: skillpacks/executive/coo-advisor
capability:
  domain: executive
  category: advisory
  intents:
  - coo advisory
  - operational feasibility
  - execution constraints
  - workflow bottlenecks
runtime:
  entrypoint: SKILL.md
  tools: []
permissions:
  required:
  - READ_LOCAL
risk:
  level: low
trust:
  tier: T0
applicability:
  project_stages:
  - P0_DISCOVERY
  - P1_PROBLEM_VALIDATION
  - P2_SOLUTION_VALIDATION
  - P3_BUILD_VALIDATE
  - P4_GO_TO_MARKET
  - P5_OPERATE_GROWTH
  - P6_SCALE_GOVERN
  gates:
  - G0
  - G1
  - G2
  - G3
  - G4
  - G5
  - G6
  required_context:
  - workspace
  - project
  outputs:
  - proposal
  - artifact
autonomy:
  ceiling: L1_PROPOSE
  side_effect_class: A
evidence:
  min_source_refs: 1
  self_validation_forbidden: true
quality:
  eval_suite: evals/executive/board_cases.yaml
  required_negative_cases:
  - missing-workspace
  - cross-workspace
  - peer-draft-forbidden
