  name: Skill Adaptation, Governance & Attribution Policy
  version: 1.0.1
  description: Quy trình tiếp nhận, đánh giá bản quyền, chuyển đổi và quản trị nguồn
    gốc các gói kỹ năng (Skillpacks) từ bên ngoài vào hệ sinh thái COSA.
publisher:
