apiVersion: agentos.ai/v1
kind: Skill
metadata:
  id: product.continuous-discovery
  name: Continuous Discovery Habits
  version: 1.0.1
  description: Thiết lập và vận hành chu kỳ khám phá khách hàng liên tục (Teresa Torres
    model) với Opportunity Solution Tree và lịch phỏng vấn hàng tuần.
publisher:
  name: cosa
  type: official
source:
  type: local
  path: skillpacks/product/continuous-discovery
capability:
  domain: product
  category: discovery_habits
  intents:
  - continuous discovery
  - kham pha lien tuc
  - opportunity solution tree
  - phong van hang tuan
  - customer touchpoints
runtime:
  environment: python
  entrypoint: SKILL.md
  tools:
  - strategy.evidence.list
  - strategy.evidence.create
permissions:
  required:
  - READ_LOCAL
  - WRITE_LOCAL
risk:
  level: low
trust:
  tier: T0
applicability:
  project_stages:
  - P0_DISCOVERY
  - P1_PROBLEM_VALIDATION
  - P2_SOLUTION_VALIDATION
  - P3_BUILD_VALIDATE
  - P4_GO_TO_MARKET
  gates:
  - G0
  - G1
  - G2
  - G3
  - G4
  required_context:
  - workspace
  - project
  outputs:
  - artifact
  - proposal
autonomy:
  ceiling: L1_PROPOSE
  side_effect_class: A
evidence:
  min_source_refs: 1
  self_validation_forbidden: true
quality:
  eval_suite: evals/product/continuous-discovery.yaml
  required_negative_cases:
  - missing-workspace
  - cross-workspace
  - missing-interview-evidence
