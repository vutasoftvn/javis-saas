apiVersion: agentos.ai/v1
kind: Skill
metadata:
  id: strategy.evidence-synthesis
  name: Evidence Synthesis & Strength Evaluation
  version: 1.1.1
  description: Tổng hợp dữ liệu kết quả thử nghiệm, đánh giá độ mạnh bằng chứng (Weak/Medium/Strong),
    phân định Facts vs Inference và cập nhật trạng thái giả định.
publisher:
  name: cosa
  type: official
source:
  type: local
  path: skillpacks/strategy/evidence-synthesis
capability:
  domain: strategy
  category: evidence
  intents:
  - tổng hợp bằng chứng
  - đánh giá độ mạnh evidence
  - synthesize evidence
  - evaluate evidence strength
  - ghi nhận kết quả thử nghiệm
  - phân tích dữ liệu thực nghiệm
runtime:
  environment: python
  entrypoint: SKILL.md
  tools:
  - strategy.evidence.create
  - strategy.evidence.list
permissions:
  required:
  - READ_LOCAL
  - MODIFY_BUSINESS_DATA
risk:
  level: medium
trust:
  tier: T0
applicability:
  project_stages:
  - P1_PROBLEM_VALIDATION
  - P2_SOLUTION_VALIDATION
  - P3_BUILD_VALIDATE
  - P4_GO_TO_MARKET
  - P5_OPERATE_GROWTH
  gates:
  - G1
  - G2
  - G3
  - G4
  - G5
  required_context:
  - workspace
  - project
  outputs:
  - artifact
  - proposal
autonomy:
  ceiling: L1_PROPOSE
  side_effect_class: A
evidence:
  min_source_refs: 1
  self_validation_forbidden: true
quality:
  eval_suite: evals/strategy/evidence-synthesis.yaml
  required_negative_cases:
  - missing-workspace
  - cross-workspace
  - missing-evidence-input
