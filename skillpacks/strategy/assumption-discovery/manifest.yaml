apiVersion: agentos.ai/v1
kind: Skill

metadata:
  id: strategy.assumption-discovery
  name: Assumption Discovery & Ranking
  version: 1.0.0
  description: Xác định, phân loại và xếp hạng các giả định cốt lõi (Desirability, Feasibility, Viability) cùng rủi ro chưa kiểm chứng của venture.

publisher:
  name: javis
  type: official

source:
  type: local
  path: skillpacks/strategy/assumption-discovery

capability:
  domain: strategy
  category: assumptions
  intents:
    - tìm giả định chính
    - xác định rủi ro chưa kiểm chứng
    - discover assumptions
    - identify unvalidated risks
    - phân loại giả định
    - liệt kê giả định rủi ro

runtime:
  environment: python
  entrypoint: SKILL.md
  tools:
    - strategy.assumption.create
    - strategy.assumption.list

permissions:
  required:
    - READ_LOCAL
    - MODIFY_BUSINESS_DATA

risk:
  level: medium

trust:
  tier: T0
