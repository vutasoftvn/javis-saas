apiVersion: agentos.ai/v1
kind: Skill
metadata:
  id: strategy.decision-capture
  name: Strategic Decision Capture & Governance Record
  version: 2.0.0
  description: Soạn dự thảo ghi nhận quyết định chiến lược lớn (Persevere, Pivot, Kill, Hold) với các câu hỏi chịu lực, lập luận đánh đổi, kết quả kỳ vọng và mốc ngày tái đánh giá.
publisher:
  name: cosa
  type: official
source:
