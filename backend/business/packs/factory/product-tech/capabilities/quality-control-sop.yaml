id: product_tech.quality_control
name:
  vi: "Quy trình Kiểm soát Chất lượng & Kiểm thử (QA/QC)"
  en: "Quality Assurance & Testing SOP"
domain: product-tech
execution_mode: assisted
artifact_type: SOP
risk:
  level: medium
  admin_review: false
required_context:
  - company
inputs:
  required:
    - release_version
    - test_cases
  optional:
    - bug_thresholds
uses:
  skill: product-management
  sop: product-release-sop
  template: product-brief
legal_context:
  required: false
output:
  canonical_format: structured_document
  allowed_exports:
    - md
