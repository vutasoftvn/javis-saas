id: marketing.content_calendar_flow
version: "1.0.0"
objective: "Quy trình lập kế hoạch, sản xuất và duyệt nội dung hàng tuần/hàng tháng."
steps:
  - id: brainstorm_topics
    action: align_with_brand_pillars
  - id: draft_content
    action: author_articles_and_posts
  - id: review_and_schedule
    action: approve_and_schedule_publication
  - id: analyze_engagement
    action: record_performance_metrics
business_rules:
  - content_must_adhere_to_brand_tone
