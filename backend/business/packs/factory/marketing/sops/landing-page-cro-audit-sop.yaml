id: marketing.landing_page_cro_audit
version: "1.0.0"
objective: "Quy trình 5 bước audit, bóc tách điểm ma sát và thiết lập A/B testing tối ưu chuyển đổi trang đích."
steps:
  - id: analyze_above_the_fold
    name: "Audit khối trên màn hình đầu tiên (Above the Fold)"
    action: evaluate_headline_subheadline_and_primary_cta
  - id: evaluate_friction_and_form
    name: "Phân tích điểm ma sát và các trường nhập liệu"
    action: inspect_form_fields_and_guarantees
  - id: audit_social_proof_hierarchy
    name: "Kiểm tra bằng chứng xã hội và case study"
    action: verify_client_logos_and_quantified_reviews
  - id: generate_cro_recommendation_report
    name: "Xuất bản báo cáo đề xuất cải tiến CRO"
    action: produce_structured_cro_spec
  - id: setup_ab_test_hypothesis
    name: "Thiết lập giả thuyết kiểm thử A/B"
    action: define_control_vs_variant_metrics
business_rules:
  - primary_cta_must_be_visible_without_scrolling
  - remove_all_non_essential_links_from_landing_page_header
  - all_ab_tests_must_run_for_at_least_14_days_or_100_conversions
