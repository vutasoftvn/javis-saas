id: board-meeting-sop
title: "Quy trình Tổ chức Họp Đại hội đồng Cổ đông & Hội đồng Quản trị"
version: "1.0.0"
domain: governance
jurisdiction: VN
purpose: "Chuẩn hóa quy trình chuẩn bị, thông báo, tiến hành và ban hành nghị quyết cuộc họp theo Luật Doanh nghiệp 2020."
steps:
  - step: 1
    name: "Lập Chương trình & Tài liệu họp"
    description: "Chủ tịch HĐQT hoặc người triệu tập chuẩn bị chương trình, dự thảo nghị quyết và tài liệu liên quan."
    responsible: "Thư ký HĐQT / Người triệu tập"
    timeline: "Tối thiểu 21 ngày trước ngày họp ĐHĐCĐ (hoặc 03 ngày làm việc đối với họp HĐQT)"
  - step: 2
    name: "Gửi Thông báo mời họp"
    description: "Gửi thông báo mời họp kèm tài liệu hoặc đường dẫn tải tài liệu đến tất cả cổ đông/thành viên có quyền biểu quyết."
    compliance_check: "Điều 143, Điều 157 Luật Doanh nghiệp 2020"
  - step: 3
    name: "Tiến hành Họp & Kiểm tra tư cách biểu quyết"
    description: "Kiểm tra tỷ lệ đại diện vốn tham dự họp để xác định tính hợp lệ của phiên họp. Tiến hành thảo luận và biểu quyết từng nội dung."
  - step: 4
    name: "Lập Biên bản & Ký ban hành Nghị quyết"
    description: "Ghi chép đầy đủ diễn biến, kết quả biểu quyết vào Biên bản họp. Ký biên bản và ban hành Nghị quyết cuộc họp gửi cho các thành viên trong vòng 15 ngày."
