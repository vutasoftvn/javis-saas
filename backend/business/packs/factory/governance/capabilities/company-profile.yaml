id: governance.company_profile
name:
  vi: "Hồ sơ pháp lý doanh nghiệp"
  en: "Company Legal Profile"
domain: governance
execution_mode: direct
artifact_type: POL
risk:
  level: low
  admin_review: false
required_context:
  - company
inputs:
  required:
    - company_name
    - tax_code
    - legal_rep
  optional:
    - address
    - chartered_capital
uses:
  skill: legal-document-drafting
  sop: create-legal-document
  template: company-profile
legal_context:
  required: false
output:
  canonical_format: structured_document
  allowed_exports:
    - md
    - pdf
