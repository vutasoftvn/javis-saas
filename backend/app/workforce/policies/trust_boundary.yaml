# COSA Trust Boundary & Execution Sandbox Profile
version: "1.0.0"

trust_profiles:
  high_trust_orchestrator:
    agents: ["founder_copilot", "executive_lead"]
    allow_shell: false
    allow_file_system_write: false
    allow_tool_dispatch: true
    secret_access_mode: "REFERENCE_ONLY"  # Không nạp API Key trần vào prompt
    isolation_level: "CONTEXT_ISOLATED"

  standard_specialist:
    agents: ["cfo_agent", "cmo_agent", "sales_agent", "legal_agent"]
    allow_shell: false
    allow_file_system_write: false
    allow_tool_dispatch: true
    secret_access_mode: "REFERENCE_ONLY"
    isolation_level: "DYNAMIC_SANDBOX"

  coding_agent:
    agents: ["tech_lead_agent", "developer_agent"]
    allow_shell: false
    allow_file_system_write: true
    workspace_mode: "GIT_WORKTREE_PER_TASK" # Cách ly worktree per-task, cấm push main
    protected_branches: ["main", "master", "production", "release"]
    require_pr_approval: true

  low_trust_external:
    agents: ["web_researcher", "untrusted_data_parser"]
    allow_shell: false
    allow_file_system_write: false
    allow_network_unrestricted: false
    allow_credentials: false
    output_enforcement: "STRICT_JSON_SCHEMA"
    quarantine_output: true
