# COSA Financial Governance & Budget Policy
version: "1.0.0"

thresholds:
  warning_percent: 0.80      # 80%: Gửi cảnh báo Notification cho Founder/Lead
  urgent_percent: 0.90       # 90%: Cảnh báo khẩn cấp (Urgent Notification)
  hard_stop_percent: 1.00    # 100%: Lập tức chặn toàn bộ phiên chạy mới (Hard Block)

default_limits_usd:
  company_monthly: 500.0
  department_monthly:
    Executive: 150.0
    Finance: 100.0
    Marketing: 100.0
    Sales: 100.0
    Engineering: 150.0
  agent_monthly_cap: 50.0

pricing_per_1k_tokens_usd:
  claude-3-7-sonnet:
    input: 0.003
    output: 0.015
  gemini-2-5-pro:
    input: 0.00125
    output: 0.005
  deepseek-r1:
    input: 0.00055
    output: 0.00219
  http-generic:
    input: 0.001
    output: 0.002

exchange_rate:
  usd_to_vnd: 25400.0
