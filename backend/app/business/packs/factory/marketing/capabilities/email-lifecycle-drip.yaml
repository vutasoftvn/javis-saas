id: marketing.email_lifecycle_drip
name:
  vi: "Thiết kế Chuỗi Email Vòng đời Tự động"
  en: "Automated Email Lifecycle Sequence Builder"
domain: marketing
execution_mode: assisted
artifact_type: MAN
risk:
  level: low
  admin_review: false
required_context:
  - company
inputs:
  required:
    - sequence_type
    - target_trigger_event
    - core_call_to_action
  optional:
    - number_of_emails
    - delay_intervals
uses:
  skill: emails
  sop: email-lifecycle-sop
  template: email-lifecycle-sequence
legal_context:
  required: false
output:
  canonical_format: structured_document
  allowed_exports:
    - md
    - html
