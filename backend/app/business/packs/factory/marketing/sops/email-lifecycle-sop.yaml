id: marketing.email_lifecycle
version: "1.0.0"
objective: "Quy trình thiết lập, kiểm thử nội dung và đo lường hiệu suất chuỗi email tự động theo từng giai đoạn chuyển đổi của khách hàng."
steps:
  - id: define_sequence_trigger_and_goal
    name: "Xác định sự kiện kích hoạt và mục tiêu chuyển đổi"
    action: map_user_action_to_lifecycle_stage
  - id: draft_personalized_email_copy
    name: "Soạn thảo nội dung email có biến cá nhân hóa"
    action: generate_subject_lines_and_body_markdown
  - id: set_time_delays_and_throttling
    name: "Thiết lập khoảng thời gian chờ (Delays) và giới hạn gửi"
    action: configure_sending_cadence_and_rules
  - id: execute_spam_and_deliverability_test
    name: "Kiểm tra khả năng gửi vào Inbox và tỷ lệ spam"
    action: verify_dkim_spf_and_content_score
  - id: monitor_and_optimize_kpis
    name: "Giám sát tỷ lệ mở, click và hủy đăng ký"
    action: review_analytics_and_iterate_subject_lines
business_rules:
  - every_email_must_contain_one_click_unsubscribe_link
  - maximum_sending_frequency_is_1_email_per_day_per_user_except_transactional
