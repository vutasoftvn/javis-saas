id: sales.standard_process
version: "1.0.0"
objective: "Quy chuẩn hóa chu kỳ bán hàng từ Tiếp cận đến Chốt giao dịch."
stages:
  - lead
  - qualify
  - discovery
  - proposal
  - negotiation
  - won
  - lost
required_data:
  qualify:
    - customer_need
    - decision_role
    - expected_value
  proposal:
    - scope
    - price
    - timeline
metrics:
  - conversion_rate
  - average_deal_size
  - sales_cycle
  - win_rate
system_of_record: crm
