id: operations.create_sop
name:
  vi: "Thiết kế Quy trình vận hành chuẩn (SOP)"
  en: "Author Standard Operating Procedure (SOP)"
domain: operations
execution_mode: assisted
artifact_type: SOP
risk:
  level: medium
  admin_review: true
required_context:
  - company
inputs:
  required:
    - sop_title
    - purpose
    - steps
  optional:
    - roles
    - kpi_sla
uses:
  skill: sop-authoring
  sop: standard-sop-review
  template: sop-standard
legal_context:
  required: false
output:
  canonical_format: structured_document
  allowed_exports:
    - md
    - pdf
