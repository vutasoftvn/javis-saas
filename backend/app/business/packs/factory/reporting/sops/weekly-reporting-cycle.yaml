id: reporting.weekly_cycle
version: "1.0.0"
objective: "Thu thập số liệu, đóng tuần và phát hành Báo cáo Điều hành Tuần."
steps:
  - id: auto_collect_metrics
    action: aggregate_weekly_kpis
  - id: gather_team_inputs
    action: collect_unfinished_tasks_and_risks
  - id: synthesize_report
    action: run_skill
  - id: extract_hologram_signals
    action: create_executive_cards
  - id: publish_artifact
    action: create_artifact
business_rules:
  - weekly_report_due_every_friday_17h
  - decisions_needed_must_be_flagged_for_founder
hologram:
  create_signal_if:
    - critical_issues_count > 0
    - pending_founder_decisions == true
