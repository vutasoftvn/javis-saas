id: finance.monthly_close_process
version: "1.0.0"
objective: "Quy trình thực hiện khóa sổ kế toán và lập báo cáo tài chính định kỳ hàng tháng."
steps:
  - id: reconcile_bank
    action: match_bank_feed_with_ledger
  - id: reconcile_receivables_payables
    action: verify_customer_and_vendor_balances
  - id: accrue_expenses_and_depreciation
    action: record_monthly_accruals
  - id: close_period
    action: lock_accounting_period
  - id: generate_financial_reports
    action: produce_pl_and_balance_sheet
business_rules:
  - period_lock_requires_founder_approval
  - variance_over_5_percent_requires_explanation
