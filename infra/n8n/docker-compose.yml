services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:1.76.0
    container_name: javis_n8n

    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      # Network & URL configuration for local dev
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_WEBHOOK_URL=http://localhost:5678/
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=Asia/Ho_Chi_Minh
      - NODE_ENV=production
      # Disable telemetry / unnecessary prompts in dev
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      - N8N_VERSION_NOTIFICATIONS_ENABLED=false
      # Security & executions
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168
      - EXECUTIONS_DATA_PRUNE_MAX_COUNT=50000
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/data/workflows
    extra_hosts:
      # Allows n8n container to reach COSA brain-api running on host at http://host.docker.internal:8000
      - "host.docker.internal:host-gateway"

volumes:
  n8n_data:
