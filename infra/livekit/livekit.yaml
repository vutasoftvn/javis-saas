# LiveKit Server configuration for macOS Local Development
# Optimized for Desktop low-latency WebRTC loopback

port: 7880
bind_addresses:
  - "0.0.0.0"

rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50020
  use_external_ip: false
  node_ip: "127.0.0.1"

# Keys for local development
keys:
  devkey: secret_local_cosa_desktop_key

logging:
  json: false
  level: info

room:
  empty_timeout: 300
  max_participants: 10
