services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: javis_postgres
    ports:
      # dev-only: expose to host loopback for local psql/DB tools. Not public internet.
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_USER=javis
      - POSTGRES_PASSWORD=javis
      - POSTGRES_DB=javis
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U javis"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: javis_minio
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile.api
    command: alembic upgrade head
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://javis:javis@postgres:5432/javis}
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  brain-api:
    build:
      context: ./backend
      dockerfile: Dockerfile.api
    container_name: javis_brain_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir app
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - APP_ENV=${APP_ENV:-development}
      - DATABASE_URL=${DATABASE_URL:-postgresql://javis:javis@postgres:5432/javis}
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      # Khóa ký JWT cho brain-api. Production phải cung cấp giá trị ngẫu nhiên qua
      # secret manager, không dùng fallback phát triển.
      - JWT_SECRET=${JWT_SECRET:-supersecret-dev-key}
      # brain-api tự điền provider/model khi tạo chat session nên phải biết cùng một
      # mặc định với worker, nếu không session sẽ tạo ra với model worker không gọi được.
      - CHAT_DEFAULT_PROVIDER=${CHAT_DEFAULT_PROVIDER:-deepseek}
      - CHAT_DEFAULT_MODEL=${CHAT_DEFAULT_MODEL:-deepseek-chat}
      # Chỉ là CỜ, không phải khoá: "${KEY:+1}" cho ra "1" khi khoá tồn tại và rỗng khi
      # không. brain-api không gọi provider nên không cần biết giá trị khoá, chỉ cần biết
      # model nào dùng được để đánh dấu trong model picker.
      - PROVIDER_CONFIGURED_OPENROUTER=${OPENROUTER_API_KEY:+1}
      - PROVIDER_CONFIGURED_DEEPSEEK=${DEEPSEEK_API_KEY:+1}

      - PROVIDER_CONFIGURED_OPENAI=${OPENAI_API_KEY:+1}
      - PROVIDER_CONFIGURED_ANTHROPIC=${ANTHROPIC_API_KEY:+1}
      - PROVIDER_CONFIGURED_GEMINI=${GEMINI_API_KEY:+1}
      # OAuth Google: brain-api dựng URL đăng nhập và nhận callback nên cần cả hai khoá.
      # MASTER_SECRET_KEY dùng để mã hoá refresh token trước khi ghi DB - đổi khoá này là
      # mọi kết nối Gmail đang có thành rác, người dùng phải đăng nhập lại.
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-http://localhost:8000/api/v1/connectors/google/oauth/callback}
      - MASTER_SECRET_KEY=${MASTER_SECRET_KEY:-default-insecure-master-key-for-dev}
      - LIVEKIT_URL=${LIVEKIT_URL:-wss://example.livekit.cloud}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-devkey}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-secret_local_cosa_desktop_key}
      - LIVEKIT_LOCAL_URL=${LIVEKIT_LOCAL_URL:-ws://127.0.0.1:7880}
      - LIVEKIT_LOCAL_API_KEY=${LIVEKIT_LOCAL_API_KEY:-devkey}
      - LIVEKIT_LOCAL_API_SECRET=${LIVEKIT_LOCAL_API_SECRET:-secret_local_cosa_desktop_key}
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  agent-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    container_name: javis_agent_worker
    environment:
      - APP_ENV=${APP_ENV:-development}
      - JAVIS_STATE_DIR=/var/lib/javis-connectors
      - DATABASE_URL=${DATABASE_URL:-postgresql://javis:javis@postgres:5432/javis}
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      - DEEPSEEK_DEFAULT_MODEL=${DEEPSEEK_DEFAULT_MODEL:-deepseek-chat}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - CHAT_DEFAULT_PROVIDER=${CHAT_DEFAULT_PROVIDER:-deepseek}
      - CHAT_DEFAULT_MODEL=${CHAT_DEFAULT_MODEL:-deepseek-chat}
      # Worker là bên gọi tool Gmail: nó tự làm mới access token từ refresh token nên cần
      # đủ bộ khoá OAuth lẫn khoá giải mã token đã lưu.
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-http://localhost:8000/api/v1/connectors/google/oauth/callback}
      - MASTER_SECRET_KEY=${MASTER_SECRET_KEY:-default-insecure-master-key-for-dev}
      # OpenSandbox Execution Runtime: Chỉ worker mới kết nối và giữ cấu hình OpenSandbox
      - COSA_EXECUTION_PROVIDER=${COSA_EXECUTION_PROVIDER:-mock}
      - OPEN_SANDBOX_DOMAIN=${OPEN_SANDBOX_DOMAIN:-http://opensandbox:8080}
      - OPEN_SANDBOX_API_KEY=${OPEN_SANDBOX_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      brain-api:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./backend:/app
      - connector_state:/var/lib/javis-connectors
    restart: unless-stopped

  opensandbox:
    image: opensandbox/server:0.2.2
    container_name: javis_opensandbox
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - SANDBOX_CONFIG_PATH=/etc/opensandbox/sandbox.toml
    volumes:
      - ./infra/opensandbox/sandbox.toml:/etc/opensandbox/sandbox.toml:ro
      - /var/run/docker.sock:/var/run/docker.sock
    profiles: ["sandbox"]
    restart: unless-stopped

  livekit:
    image: livekit/livekit-server:latest
    container_name: javis_livekit_local
    command: --config /etc/livekit.yaml
    volumes:
      - ./infra/livekit/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "127.0.0.1:7880:7880"
      - "127.0.0.1:7881:7881"
      - "127.0.0.1:50000-50020:50000-50020/udp"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:7880/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  minio_data:
  connector_state:
