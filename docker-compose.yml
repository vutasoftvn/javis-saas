services:
  # ─────────────────────────────────────────────────────────────
  # TOPOLOGY (Task 3: Explicit Configuration Contract)
  # Canonical host-based development topology:
  #   - PostgreSQL, MinIO, LiveKit run in Docker (this file)
  #   - Company Encore, COSA Control Plane Encore, FastAPI, Worker run on host
  #   - All talk via consistent loopback URLs (no container-to-host implicit routing)
  #
  # HOST URLS (for host processes):
  #   - PostgreSQL: localhost:5432 (javis_app, cosa_control_plane_app roles)
  #   - MinIO: localhost:9000
  #   - LiveKit: ws://127.0.0.1:7880 (local), wss://example.livekit.cloud (cloud)
  #   - Company Service: http://127.0.0.1:4000/healthz
  #   - COSA Control Plane: http://127.0.0.1:4001/healthz
  #   - COSA FastAPI: http://127.0.0.1:8000/healthz
  #
  # CONTAINER URLS (for Docker services that might run in containers):
  #   - PostgreSQL: postgres:5432 (on docker network)
  #   - MinIO: minio:9000 (on docker network)
  #   - LiveKit: livekit:7880 (on docker network)
  #
  # ─────────────────────────────────────────────────────────────
  # Local PostgreSQL — dùng khi chạy trên Hostinger hoặc dev local.
  # Khi chuyển sang Viettel vDBS: bỏ profile này, set DATABASE_URL
  # và CONTROL_PLANE_DATABASE_URL trỏ tới managed DB bên ngoài.
  # ─────────────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: cosa_postgres
    ports:
      # dev-only: expose to host loopback for local psql/DB tools. Not public internet.
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-javis}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-javis}
      - POSTGRES_DB=${POSTGRES_DB:-javis}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-javis}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: cosa_minio
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────
  # legacy/backend + legacy/agent_runtime đã bị XOÁ HẲN 2026-08-25
  # (Sub-project D — người dùng xác nhận không dùng Google OAuth qua
  # brain-api, an toàn xoá luôn thay vì port). 4 service cũ ở đây
  # (migrate, migrate-control-plane, brain-api, agent-worker) đã bị xoá
  # cùng lúc — xem docs/architecture/LEGACY_BACKEND_CAPABILITY_AUDIT_2026-08-25.md
  # cho bằng chứng năng lực nào bị mất (n8n bridge, device execution —
  # không ai gọi; Google OAuth — không dùng). Migration schema cho
  # `cosa_control_plane` giờ chạy qua `make services-migrate-cosa`
  # (baseline_v1, services/cosa/migrations/) thay vì Alembic legacy.
  # ─────────────────────────────────────────────────────────────

  # ─────────────────────────────────────────────────────────────
  # Mô hình triển khai "3 chân" (2026-08-25) — cosa-api/cosa-worker chỉ là
  # 1 trong 3 phần cần chạy song song để hệ thống hoạt động đầy đủ:
  #   1. Docker Compose (ở đây): postgres, minio, cosa-api, cosa-worker.
  #   2. Encore.ts (services/cosa + services/company) — KHÔNG nằm trong
  #      docker-compose.yml, chạy/deploy riêng (`make services-dev-cosa`,
  #      `make services-dev-company`, hoặc Encore Cloud deploy thật).
  #      cosa-worker cần COSA_CONTROL_PLANE_URL trỏ services/cosa đang
  #      chạy thật, mặc định http://127.0.0.1:4001 — nếu Encore chưa chạy,
  #      worker sẽ fail/retry cho tới khi kết nối được.
  #   3. Flutter frontend — build/deploy riêng.
  # `profiles: [cosa]` CỐ Ý giữ nguyên (không đặt làm mặc định) — xem
  # `make deploy-app` (Makefile) tự thêm `--profile cosa`, tránh dev khác
  # vô tình bật cosa-worker khi chưa chạy Encore.
  # ─────────────────────────────────────────────────────────────
  cosa-api:
    build:
      context: .
      dockerfile: apps/cosa/Dockerfile.api
    container_name: cosa_api
    ports:
      - "127.0.0.1:8001:8000"
    # Task 3: Host-based topology — cosa-api runs on host, not in container.
    # If deployed in container, these required env vars must be provided explicitly;
    # no fallback/default allowed (fail-fast on missing contract).
    environment:
      - AGENT_CORE_DATABASE_URL=${AGENT_CORE_DATABASE_URL:?required — host URL to Agent Core database}
      - COSA_DATABASE_URL=${COSA_DATABASE_URL:?required — host URL to COSA database}
      - COMPANY_DATABASE_URL=${COMPANY_DATABASE_URL:?required — host URL to Company database}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:?required — DeepSeek API key for LLM calls}
      - COSA_CONTROL_PLANE_URL=${COSA_CONTROL_PLANE_URL:?required — host URL to COSA Control Plane}
      - COMPANY_SERVICE_URL=${COMPANY_SERVICE_URL:?required — host URL to Company Service}
      - COSA_WORKER_SERVICE_TOKEN=${COSA_WORKER_SERVICE_TOKEN:?required — JWT token for worker authentication}
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - cosa
    restart: unless-stopped

  cosa-worker:
    build:
      context: .
      dockerfile: apps/cosa/Dockerfile.worker
    container_name: cosa_worker
    # Task 3: Host-based topology — cosa-worker runs on host, not in container.
    # If deployed in container, these required env vars must be provided explicitly;
    # no fallback/default allowed (fail-fast on missing contract).
    environment:
      - AGENT_CORE_DATABASE_URL=${AGENT_CORE_DATABASE_URL:?required — host URL to Agent Core database}
      - COSA_DATABASE_URL=${COSA_DATABASE_URL:?required — host URL to COSA database}
      - COMPANY_DATABASE_URL=${COMPANY_DATABASE_URL:?required — host URL to Company database}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:?required — DeepSeek API key for LLM calls}
      - COSA_CONTROL_PLANE_URL=${COSA_CONTROL_PLANE_URL:?required — host URL to COSA Control Plane}
      - COMPANY_SERVICE_URL=${COMPANY_SERVICE_URL:?required — host URL to Company Service}
      - COSA_WORKER_SERVICE_TOKEN=${COSA_WORKER_SERVICE_TOKEN:?required — JWT token for worker authentication}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      - DEEPSEEK_DEFAULT_MODEL=${DEEPSEEK_DEFAULT_MODEL:-deepseek-chat}
    depends_on:
      postgres:
        condition: service_healthy
      cosa-api:
        condition: service_started
    profiles:
      - cosa
    restart: unless-stopped

  opensandbox:
    image: opensandbox/server:0.2.2
    container_name: cosa_opensandbox
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - SANDBOX_CONFIG_PATH=/etc/opensandbox/sandbox.toml
    volumes:
      - ./infra/opensandbox/sandbox.toml:/etc/opensandbox/sandbox.toml:ro
      - /var/run/docker.sock:/var/run/docker.sock
    profiles: ["sandbox"]
    restart: unless-stopped

  livekit:
    image: livekit/livekit-server:latest
    container_name: cosa_livekit_local
    command: --config /etc/livekit.yaml
    volumes:
      - ./infra/livekit/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "127.0.0.1:7880:7880"
      - "127.0.0.1:7881:7881"
      - "127.0.0.1:50000-50020:50000-50020/udp"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:7880/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  realtime-agent:
    build:
      context: ./services/realtime_agent
      dockerfile: Dockerfile
    container_name: cosa_realtime_agent
    environment:
      - DATABASE_URL=${DATABASE_URL:?required — host URL to Javis database}
      - LIVEKIT_URL=${LIVEKIT_URL:-wss://example.livekit.cloud}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:?required — LiveKit Cloud API key}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:?required — LiveKit Cloud API secret}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GOOGLE_API_KEY=${GEMINI_API_KEY:-}
      - LIVEKIT_LOCAL_HTTP_URL=http://livekit:7880
      - LIVEKIT_LOCAL_URL=ws://livekit:7880
      - LIVEKIT_LOCAL_API_KEY=${LIVEKIT_LOCAL_API_KEY:-devkey}
      - LIVEKIT_LOCAL_API_SECRET=${LIVEKIT_LOCAL_API_SECRET:-secret_local_cosa_desktop_key}
      - VOICE_INTERRUPTION_MIN_DURATION=${VOICE_INTERRUPTION_MIN_DURATION:-0.5}
      - VOICE_MIN_ENDPOINTING_DELAY=${VOICE_MIN_ENDPOINTING_DELAY:-0.5}
      - VOICE_MAX_ENDPOINTING_DELAY=${VOICE_MAX_ENDPOINTING_DELAY:-3.0}
    volumes:
      - ./services/realtime_agent:/app
    depends_on:
      postgres:
        condition: service_healthy
      livekit:
        condition: service_healthy
    restart: unless-stopped

  # Second worker process registered against LiveKit Cloud instead of the
  # local server (main.py::_resolve_local_livekit prefers local whenever it's
  # healthy, so a plain second copy of `realtime-agent` would just re-register
  # on local too). Desktop rooms are created on local LiveKit and only this
  # worker's local-registered sibling above ever sees them; mobile/web rooms
  # are created on LIVEKIT_URL (cloud) and only this worker sees those - each
  # worker's LiveKit signaling connection only receives dispatches for the one
  # server it registered with, so running both concurrently is what makes
  # desktop-local and mobile-cloud voice both get an AI in the room.
  realtime-agent-cloud:
    build:
      context: ./services/realtime_agent
      dockerfile: Dockerfile
    container_name: cosa_realtime_agent_cloud
    environment:
      - DATABASE_URL=${DATABASE_URL:?required — host URL to Javis database}
      - LIVEKIT_URL=${LIVEKIT_URL:-wss://example.livekit.cloud}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:?required — LiveKit Cloud API key}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:?required — LiveKit Cloud API secret}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GOOGLE_API_KEY=${GEMINI_API_KEY:-}
      - LIVEKIT_FORCE_CLOUD=true
      - VOICE_INTERRUPTION_MIN_DURATION=${VOICE_INTERRUPTION_MIN_DURATION:-0.5}
      - VOICE_MIN_ENDPOINTING_DELAY=${VOICE_MIN_ENDPOINTING_DELAY:-0.5}
      - VOICE_MAX_ENDPOINTING_DELAY=${VOICE_MAX_ENDPOINTING_DELAY:-3.0}
    volumes:
      - ./services/realtime_agent:/app
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
  connector_state:
