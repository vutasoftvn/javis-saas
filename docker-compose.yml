services:
  # ─────────────────────────────────────────────────────────────
  # TOPOLOGY (Task 3: Explicit Configuration Contract)
  # Canonical host-based development topology:
  #   - PostgreSQL, MinIO, LiveKit run in Docker (this file)
  #   - Company Encore, COSA Control Plane Encore, FastAPI, Worker run on host
  #   - All talk via consistent loopback URLs (no container-to-host implicit routing)
  #
  # HOST URLS (for host processes):
  #   - PostgreSQL: localhost:5432 (javis_app, cosa_control_plane_app roles)
  #   - MinIO: localhost:9000
  #   - LiveKit: ws://127.0.0.1:7880 (local), wss://example.livekit.cloud (cloud)
  #   - Company Service: http://127.0.0.1:4000/healthz
  #   - COSA Control Plane: http://127.0.0.1:4001/healthz
  #   - COSA FastAPI: http://127.0.0.1:8000/healthz
  #
  # CONTAINER URLS (for Docker services that might run in containers):
  #   - PostgreSQL: postgres:5432 (on docker network)
  #   - MinIO: minio:9000 (on docker network)
  #   - LiveKit: livekit:7880 (on docker network)
  #
  # ─────────────────────────────────────────────────────────────
  # Local PostgreSQL — dùng khi chạy trên Hostinger hoặc dev local.
  # Khi chuyển sang Viettel vDBS: bỏ profile này, set DATABASE_URL
  # và CONTROL_PLANE_DATABASE_URL trỏ tới managed DB bên ngoài.
  # ─────────────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: cosa_postgres
    ports:
      # dev-only: expose to host loopback for local psql/DB tools. Not public internet.
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-javis}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-javis}
      - POSTGRES_DB=${POSTGRES_DB:-javis}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-javis}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-28Z
    container_name: cosa_minio
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────
  # legacy/backend + legacy/agent_runtime đã bị XOÁ HẲN 2026-08-25
  # (Sub-project D — người dùng xác nhận không dùng Google OAuth qua
  # brain-api, an toàn xoá luôn thay vì port). 4 service cũ ở đây
  # (migrate, migrate-control-plane, brain-api, agent-worker) đã bị xoá
  # cùng lúc — xem docs/architecture/LEGACY_BACKEND_CAPABILITY_AUDIT_2026-08-25.md
  # cho bằng chứng năng lực nào bị mất (n8n bridge, device execution —
  # không ai gọi; Google OAuth — không dùng). Migration schema cho
  # `cosa_control_plane` giờ chạy qua `make services-migrate-cosa`
  # (baseline_v1, services/cosa/migrations/) thay vì Alembic legacy.
  # ─────────────────────────────────────────────────────────────

  # ─────────────────────────────────────────────────────────────
  # Mô hình triển khai "3 chân" (2026-08-25) — cosa-api/cosa-worker chỉ là
  # 1 trong 3 phần cần chạy song song để hệ thống hoạt động đầy đủ:
  #   1. Docker Compose (ở đây): postgres, minio, cosa-api, cosa-worker.
  #   2. Encore.ts (services/cosa + services/company) — KHÔNG nằm trong
  #      docker-compose.yml, chạy/deploy riêng (`make services-dev-cosa`,
  #      `make services-dev-company`, hoặc Encore Cloud deploy thật).
  #      cosa-worker cần COSA_CONTROL_PLANE_URL trỏ services/cosa đang
  #      chạy thật, mặc định http://127.0.0.1:4001 — nếu Encore chưa chạy,
  #      worker sẽ fail/retry cho tới khi kết nối được.
  #   3. Flutter frontend — build/deploy riêng.
  # `profiles: [cosa]` CỐ Ý giữ nguyên (không đặt làm mặc định) — xem
  # `make deploy-app` (Makefile) tự thêm `--profile cosa`, tránh dev khác
  # vô tình bật cosa-worker khi chưa chạy Encore.
  # ─────────────────────────────────────────────────────────────
  # ─────────────────────────────────────────────────────────────
  # E2E & Local Services Topology
  # ─────────────────────────────────────────────────────────────
  migrate-all:
    build:
      context: .
      dockerfile: deploy/Dockerfile.migrate
    container_name: cosa_migrate_all
    environment:
      - AGENT_CORE_DATABASE_URL=${AGENT_CORE_DATABASE_URL:-postgresql+asyncpg://javis:javis@postgres:5432/javis}
      - DATABASE_URL=${DATABASE_URL:-postgresql://javis:javis@postgres:5432/javis}
      - COSA_DATABASE_URL=${COSA_DATABASE_URL:-postgresql://javis:javis@postgres:5432/cosa_control_plane?sslmode=disable}
      - CONTROL_PLANE_DATABASE_URL=${CONTROL_PLANE_DATABASE_URL:-postgresql://javis:javis@postgres:5432/cosa_control_plane?sslmode=disable}
      - COMPANY_DATABASE_URL=${COMPANY_DATABASE_URL:-postgresql://javis:javis@postgres:5432/company?sslmode=disable}
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - e2e

  services-cosa:
    build:
      context: ./services
      dockerfile: Dockerfile
    container_name: cosa_services_cosa
    working_dir: /app/cosa
    command: encore run --listen=0.0.0.0:4001 --browser=never
    ports:
      - "127.0.0.1:4001:4001"
    environment:
      - COSA_DATABASE_URL=${COSA_DATABASE_URL:?COSA_DATABASE_URL is required}
      - CONTROL_PLANE_DATABASE_URL=${CONTROL_PLANE_DATABASE_URL:?CONTROL_PLANE_DATABASE_URL is required}
      - PLATFORM_JWT_SECRET=${PLATFORM_JWT_SECRET:?PLATFORM_JWT_SECRET is required}
      - WORKER_SERVICE_JWT_SECRET=${WORKER_SERVICE_JWT_SECRET:?WORKER_SERVICE_JWT_SECRET is required}
    depends_on:
      postgres:
        condition: service_healthy
      migrate-all:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:4001/healthz || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20
    profiles:
      - e2e
    restart: unless-stopped

  services-company:
    build:
      context: ./services
      dockerfile: Dockerfile
    container_name: cosa_services_company
    working_dir: /app/company
    command: encore run --listen=0.0.0.0:4000 --browser=never
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      - COMPANY_DATABASE_URL=${COMPANY_DATABASE_URL:?COMPANY_DATABASE_URL is required}
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required}
      - PLATFORM_JWT_SECRET=${PLATFORM_JWT_SECRET:?PLATFORM_JWT_SECRET is required}
    depends_on:
      postgres:
        condition: service_healthy
      migrate-all:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:4000/healthz || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20
    profiles:
      - e2e
    restart: unless-stopped

  cosa-api:
    build:
      context: .
      dockerfile: apps/cosa/Dockerfile.api
    container_name: cosa_api
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      - AGENT_CORE_DATABASE_URL=${AGENT_CORE_DATABASE_URL:?AGENT_CORE_DATABASE_URL is required}
      - COSA_DATABASE_URL=${COSA_DATABASE_URL:?COSA_DATABASE_URL is required}
      - COMPANY_DATABASE_URL=${COMPANY_DATABASE_URL:?COMPANY_DATABASE_URL is required}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - COSA_MODEL_PROVIDER=${COSA_MODEL_PROVIDER:-fake}
      - COSA_CONTROL_PLANE_URL=${COSA_CONTROL_PLANE_URL:-http://services-cosa:4001}
      - COMPANY_SERVICE_URL=${COMPANY_SERVICE_URL:-http://services-company:4000}
      - COSA_PLATFORM_CONTROL_PLANE_URL=${COSA_PLATFORM_CONTROL_PLANE_URL:-http://services-cosa:4001}
      - COSA_EXECUTION_PLANE_URL=${COSA_EXECUTION_PLANE_URL:-http://services-cosa:4001}
      - COSA_WORKER_SERVICE_TOKEN=${COSA_WORKER_SERVICE_TOKEN:-}
      - PLATFORM_JWT_SECRET=${PLATFORM_JWT_SECRET:?PLATFORM_JWT_SECRET is required}
      - WORKER_SERVICE_JWT_SECRET=${WORKER_SERVICE_JWT_SECRET:?WORKER_SERVICE_JWT_SECRET is required}
      - CORS_ORIGINS=${CORS_ORIGINS:-${COSA_ALLOWED_ORIGINS:-http://localhost:3000}}
      - COSA_ALLOWED_ORIGINS=${COSA_ALLOWED_ORIGINS:-${CORS_ORIGINS:-http://localhost:3000}}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000/healthz\")' || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20
    profiles:
      - cosa
      - e2e
    restart: unless-stopped

  cosa-worker:
    build:
      context: .
      dockerfile: apps/cosa/Dockerfile.worker
    container_name: cosa_worker
    ports:
      - "127.0.0.1:8090:8090"
    environment:
      - AGENT_CORE_DATABASE_URL=${AGENT_CORE_DATABASE_URL:?AGENT_CORE_DATABASE_URL is required}
      - COSA_DATABASE_URL=${COSA_DATABASE_URL:?COSA_DATABASE_URL is required}
      - COMPANY_DATABASE_URL=${COMPANY_DATABASE_URL:?COMPANY_DATABASE_URL is required}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - COSA_MODEL_PROVIDER=${COSA_MODEL_PROVIDER:-fake}
      - COSA_CONTROL_PLANE_URL=${COSA_CONTROL_PLANE_URL:-http://services-cosa:4001}
      - COMPANY_SERVICE_URL=${COMPANY_SERVICE_URL:-http://services-company:4000}
      - COSA_PLATFORM_CONTROL_PLANE_URL=${COSA_PLATFORM_CONTROL_PLANE_URL:-http://services-cosa:4001}
      - COSA_EXECUTION_PLANE_URL=${COSA_EXECUTION_PLANE_URL:-http://services-cosa:4001}
      - COSA_WORKER_SERVICE_TOKEN=${COSA_WORKER_SERVICE_TOKEN:-}
      - PLATFORM_JWT_SECRET=${PLATFORM_JWT_SECRET:?PLATFORM_JWT_SECRET is required}
      - WORKER_SERVICE_JWT_SECRET=${WORKER_SERVICE_JWT_SECRET:?WORKER_SERVICE_JWT_SECRET is required}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      - DEEPSEEK_DEFAULT_MODEL=${DEEPSEEK_DEFAULT_MODEL:-deepseek-chat}
      - COSA_WORKER_HEALTH_PORT=${COSA_WORKER_HEALTH_PORT:-8090}
    depends_on:
      postgres:
        condition: service_healthy
      cosa-api:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8090/live\")' || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20
    profiles:
      - cosa
      - e2e
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────
  # cosa-ingestion-worker — isolated document converter service
  # Knowledge Ingestion Phase A (Task 4 image, Task 7 readiness gate)
  #
  # DEVELOPMENT CONVENIENCE ONLY — this Compose service is NOT production
  # isolation and this Compose network does NOT, on its own, provide egress
  # isolation. It does NOT provide:
  # - Read-only root filesystem
  # - CPU/memory/PID/time resource limits
  # - Network egress-deny policy (containers here still reach external URLs)
  #
  # Production deployment requires an orchestrator (Kubernetes NetworkPolicy /
  # deny-all egress, ECS task definition with egress rules, gVisor/Firecracker
  # runtime, etc.) providing those controls. The image ENTRYPOINT runs
  # assert_production_ingestion_ready() which fail-closes unless the
  # orchestrator sets the attestation + backend env vars below to real values.
  #
  # Converter runs as a non-root user with markitdown[pdf,docx,pptx,xlsx]==0.1.7
  # only — never the full API/worker dependency set or business secrets.
  # ─────────────────────────────────────────────────────────────
  cosa-ingestion-worker:
    build:
      context: .
      dockerfile: apps/cosa/Dockerfile.ingestion-worker
    container_name: cosa_ingestion_worker
    environment:
      # Dev mode: readiness gate returns early for any ENVIRONMENT != production.
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - KNOWLEDGE_INGESTION_ENABLED=${KNOWLEDGE_INGESTION_ENABLED:-false}
      # In production these MUST be supplied by the orchestrator, not this file:
      #   KNOWLEDGE_INGESTION_SCANNER_BACKEND   (real scanner, not fake/none)
      #   KNOWLEDGE_INGESTION_SANDBOX_BACKEND   (isolated sandbox, not inprocess)
      #   KNOWLEDGE_INGESTION_CONVERTER_SPEC    (must equal the pinned spec)
      - KNOWLEDGE_INGESTION_RESOURCE_LIMITS_ATTESTED=${KNOWLEDGE_INGESTION_RESOURCE_LIMITS_ATTESTED:-false}
      - KNOWLEDGE_INGESTION_EGRESS_DENY_ATTESTED=${KNOWLEDGE_INGESTION_EGRESS_DENY_ATTESTED:-false}
    profiles:
      - cosa
      - knowledge-ingestion
    restart: unless-stopped

  opensandbox:
    image: opensandbox/server:0.2.2
    container_name: cosa_opensandbox
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - SANDBOX_CONFIG_PATH=/etc/opensandbox/sandbox.toml
    volumes:
      - ./infra/opensandbox/sandbox.toml:/etc/opensandbox/sandbox.toml:ro
      - /var/run/docker.sock:/var/run/docker.sock
    profiles: ["sandbox"]
    restart: unless-stopped

  livekit:
    image: livekit/livekit-server:v1.8.3
    container_name: cosa_livekit_local
    command: --config /etc/livekit.yaml
    volumes:
      - ./infra/livekit/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "127.0.0.1:7880:7880"
      - "127.0.0.1:7881:7881"
      - "127.0.0.1:50000-50020:50000-50020/udp"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:7880/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  realtime-agent:
    build:
      context: ./services/realtime_agent
      dockerfile: Dockerfile
    container_name: cosa_realtime_agent
    environment:
      - DATABASE_URL=${DATABASE_URL:?required — host URL to Javis database}
      - LIVEKIT_URL=${LIVEKIT_URL:-wss://example.livekit.cloud}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:?required — LiveKit Cloud API key}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:?required — LiveKit Cloud API secret}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GOOGLE_API_KEY=${GEMINI_API_KEY:-}
      - LIVEKIT_LOCAL_HTTP_URL=http://livekit:7880
      - LIVEKIT_LOCAL_URL=ws://livekit:7880
      - LIVEKIT_LOCAL_API_KEY=${LIVEKIT_LOCAL_API_KEY:-devkey}
      - LIVEKIT_LOCAL_API_SECRET=${LIVEKIT_LOCAL_API_SECRET:-secret_local_cosa_desktop_key}
      - VOICE_INTERRUPTION_MIN_DURATION=${VOICE_INTERRUPTION_MIN_DURATION:-0.5}
      - VOICE_MIN_ENDPOINTING_DELAY=${VOICE_MIN_ENDPOINTING_DELAY:-0.5}
      - VOICE_MAX_ENDPOINTING_DELAY=${VOICE_MAX_ENDPOINTING_DELAY:-3.0}
    volumes:
      - ./services/realtime_agent:/app
    depends_on:
      postgres:
        condition: service_healthy
      livekit:
        condition: service_healthy
    restart: unless-stopped

  # Second worker process registered against LiveKit Cloud instead of the
  # local server (main.py::_resolve_local_livekit prefers local whenever it's
  # healthy, so a plain second copy of `realtime-agent` would just re-register
  # on local too). Desktop rooms are created on local LiveKit and only this
  # worker's local-registered sibling above ever sees them; mobile/web rooms
  # are created on LIVEKIT_URL (cloud) and only this worker sees those - each
  # worker's LiveKit signaling connection only receives dispatches for the one
  # server it registered with, so running both concurrently is what makes
  # desktop-local and mobile-cloud voice both get an AI in the room.
  realtime-agent-cloud:
    build:
      context: ./services/realtime_agent
      dockerfile: Dockerfile
    container_name: cosa_realtime_agent_cloud
    environment:
      - DATABASE_URL=${DATABASE_URL:?required — host URL to Javis database}
      - LIVEKIT_URL=${LIVEKIT_URL:-wss://example.livekit.cloud}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:?required — LiveKit Cloud API key}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:?required — LiveKit Cloud API secret}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GOOGLE_API_KEY=${GEMINI_API_KEY:-}
      - LIVEKIT_FORCE_CLOUD=true
      - VOICE_INTERRUPTION_MIN_DURATION=${VOICE_INTERRUPTION_MIN_DURATION:-0.5}
      - VOICE_MIN_ENDPOINTING_DELAY=${VOICE_MIN_ENDPOINTING_DELAY:-0.5}
      - VOICE_MAX_ENDPOINTING_DELAY=${VOICE_MAX_ENDPOINTING_DELAY:-3.0}
    volumes:
      - ./services/realtime_agent:/app
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
  connector_state:
