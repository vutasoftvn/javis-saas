services:
  # ─────────────────────────────────────────────────────────────
  # TOPOLOGY (Task 3: Explicit Configuration Contract)
  # Canonical host-based development topology:
  #   - PostgreSQL, MinIO, LiveKit run in Docker (this file)
  #   - Company Encore, COSA Control Plane Encore, FastAPI, Worker run on host
  #   - All talk via consistent loopback URLs (no container-to-host implicit routing)
  #
  # HOST URLS (for host processes):
  #   - PostgreSQL: localhost:5432 (agent_app, cosa_app, workspace_app roles)
  #   - MinIO: localhost:9000
  #   - LiveKit: ws://127.0.0.1:7880 (local), wss://example.livekit.cloud (cloud)
  #   - Company Service: http://127.0.0.1:4000/healthz
  #   - COSA Control Plane: http://127.0.0.1:4001/healthz
  #   - COSA FastAPI: http://127.0.0.1:8000/healthz
  #
  # CONTAINER URLS (for Docker services that might run in containers):
  #   - PostgreSQL: postgres:5432 (on docker network)
  #   - MinIO: minio:9000 (on docker network)
  #   - LiveKit: livekit:7880 (on docker network)
  #
  # ─────────────────────────────────────────────────────────────
  # Local PostgreSQL — dùng khi chạy trên Hostinger hoặc dev local.
  # Khi chuyển sang Viettel vDBS: bỏ profile này và cấu hình ba canonical
  # database URL trỏ tới managed DB bên ngoài.
  # ─────────────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: cosa_postgres
    ports:
      # dev-only: expose to host loopback for local psql/DB tools. Not public internet.
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-dev-postgres-password}
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
      - AGENT_APP_PASSWORD=${AGENT_APP_PASSWORD:-change-me-agent-app}
      - AGENT_MIGRATOR_PASSWORD=${AGENT_MIGRATOR_PASSWORD:-change-me-agent-migrator}
      - COSA_APP_PASSWORD=${COSA_APP_PASSWORD:-change-me-cosa-app}
      - COSA_MIGRATOR_PASSWORD=${COSA_MIGRATOR_PASSWORD:-change-me-cosa-migrator}
      - WORKSPACE_APP_PASSWORD=${WORKSPACE_APP_PASSWORD:-change-me-workspace-app}
      - WORKSPACE_MIGRATOR_PASSWORD=${WORKSPACE_MIGRATOR_PASSWORD:-change-me-workspace-migrator}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    # MinIO ngừng phát hành image công khai (minio/minio trên Docker Hub trả
    # 404, quay.io trả unauthorized). pgsty/minio là fork cộng đồng thay thế
    # trực tiếp (cùng entrypoint); ghim release cụ thể.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: cosa_minio
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────
  # legacy/backend + legacy/agent_runtime đã bị XOÁ HẲN 2026-08-25
  # (Sub-project D — người dùng xác nhận không dùng Google OAuth qua
  # brain-api, an toàn xoá luôn thay vì port). 4 service cũ ở đây
  # (migrate, migrate-control-plane, brain-api, agent-worker) đã bị xoá
  # cùng lúc — xem docs/architecture/LEGACY_BACKEND_CAPABILITY_AUDIT_2026-08-25.md
  # cho bằng chứng năng lực nào bị mất (n8n bridge, device execution —
  # không ai gọi; Google OAuth — không dùng). Migration schema cho
  # COSA giờ chạy qua `make services-migrate-cosa`
  # (baseline_v1, services/cosa/migrations/) thay vì Alembic legacy.
  # ─────────────────────────────────────────────────────────────

  # ─────────────────────────────────────────────────────────────
  # Mô hình triển khai "3 chân" (2026-08-25) — cosa-api/cosa-worker chỉ là
  # 1 trong 3 phần cần chạy song song để hệ thống hoạt động đầy đủ:
  #   1. Docker Compose (ở đây): postgres, minio, cosa-api, cosa-worker.
  #   2. Encore.ts (services/cosa + services/company) — KHÔNG nằm trong
  #      docker-compose.yml, chạy/deploy riêng (`make services-dev-cosa`,
  #      `make services-dev-company`, hoặc Encore Cloud deploy thật).
  #      cosa-worker cần COSA_CONTROL_PLANE_URL trỏ services/cosa đang
  #      chạy thật, mặc định http://127.0.0.1:4001 — nếu Encore chưa chạy,
  #      worker sẽ fail/retry cho tới khi kết nối được.
  #   3. Flutter frontend — build/deploy riêng.
  # `profiles: [cosa]` CỐ Ý giữ nguyên (không đặt làm mặc định) — xem
  # `make deploy-app` (Makefile) tự thêm `--profile cosa`, tránh dev khác
  # vô tình bật cosa-worker khi chưa chạy Encore.
  # ─────────────────────────────────────────────────────────────
  # ─────────────────────────────────────────────────────────────
  # E2E & Local Services Topology
  # ─────────────────────────────────────────────────────────────
  migrate-all:
    build:
      context: .
      dockerfile: deploy/Dockerfile.migrate
    container_name: cosa_migrate_all
    environment:
      - AGENT_MIGRATOR_DATABASE_URL=${AGENT_MIGRATOR_DATABASE_URL:-postgresql+asyncpg://agent_migrator:change-me-agent-migrator@postgres:5432/agent}
      - COSA_MIGRATOR_DATABASE_URL=${COSA_MIGRATOR_DATABASE_URL:-postgresql://cosa_migrator:change-me-cosa-migrator@postgres:5432/cosa?sslmode=disable}
      - WORKSPACE_MIGRATOR_DATABASE_URL=${WORKSPACE_MIGRATOR_DATABASE_URL:-postgresql://workspace_migrator:change-me-workspace-migrator@postgres:5432/workspace?sslmode=disable}
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - e2e

  services-cosa:
    build:
      context: ./services
      dockerfile: Dockerfile
    container_name: cosa_services_cosa
    working_dir: /app/cosa
    command: encore run --listen=0.0.0.0:4001 --browser=never
    ports:
      - "127.0.0.1:4001:4001"
    environment:
      # Giống cosa-api: URL trong .env/.env.e2e trỏ 127.0.0.1 cho process trên
      # host; trong container phải đi qua service `postgres` của mạng Docker.
      - COSA_DATABASE_URL=${SERVICES_COSA_DATABASE_URL:-postgresql://cosa_app:${COSA_APP_PASSWORD:-change-me-cosa-app}@postgres:5432/cosa?sslmode=disable}
      - WORKER_SERVICE_JWT_SECRET=${WORKER_SERVICE_JWT_SECRET:?WORKER_SERVICE_JWT_SECRET is required}
    volumes:
      # Build context là ./services nên image không có shared/contracts của
      # repo; mvp-contract-policy.ts dò ngược lên /app/shared/contracts.
      - ./shared/contracts:/app/shared/contracts:ro
    depends_on:
      postgres:
        condition: service_healthy
      migrate-all:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:4001/healthz || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20
    profiles:
      - e2e
    restart: unless-stopped

  services-company:
    build:
      context: ./services
      dockerfile: Dockerfile
    container_name: cosa_services_company
    working_dir: /app/company
    command: encore run --listen=0.0.0.0:4000 --browser=never
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      - WORKSPACE_DATABASE_URL=${SERVICES_COMPANY_WORKSPACE_DATABASE_URL:-postgresql://workspace_app:${WORKSPACE_APP_PASSWORD:-change-me-workspace-app}@postgres:5432/workspace?sslmode=disable}
      - E2E_TEST_SEED_ENABLED=${E2E_TEST_SEED_ENABLED:-}
    depends_on:
      postgres:
        condition: service_healthy
      migrate-all:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:4000/healthz || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20
    profiles:
      - e2e
    restart: unless-stopped

  cosa-api:
    build:
      context: .
      dockerfile: apps/cosa/Dockerfile.api
    container_name: cosa_api
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      # NOTE: KHÔNG đọc trực tiếp AGENT_DATABASE_URL/COSA_CONTROL_PLANE_URL... từ
      # root .env ở đây — .env định nghĩa các URL đó cho HOST process (127.0.0.1,
      # xem comment "3 chân" phía trên), còn container này nằm trên docker network
      # riêng nên 127.0.0.1 trỏ vào chính container, không tới postgres/Encore trên
      # host. Dùng biến *_DOCKER_OVERRIDE riêng (mặc định rỗng) để container luôn
      # có default đúng mạng Docker (service `postgres`, `host.docker.internal`).
      - AGENT_DATABASE_URL=${COSA_API_AGENT_DATABASE_URL:-postgresql+asyncpg://agent_app:${AGENT_APP_PASSWORD:-change-me-agent-app}@postgres:5432/agent}
      - COSA_DATABASE_URL=${COSA_API_COSA_DATABASE_URL:-postgresql://cosa_app:${COSA_APP_PASSWORD:-change-me-cosa-app}@postgres:5432/cosa?sslmode=disable}
      - WORKSPACE_DATABASE_URL=${COSA_API_WORKSPACE_DATABASE_URL:-postgresql://workspace_app:${WORKSPACE_APP_PASSWORD:-change-me-workspace-app}@postgres:5432/workspace?sslmode=disable}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - COSA_MODEL_PROVIDER=${COSA_MODEL_PROVIDER:-fake}
      - COSA_CONTROL_PLANE_URL=${COSA_API_CONTROL_PLANE_URL:-http://host.docker.internal:4001}
      - COMPANY_SERVICE_URL=${COSA_API_COMPANY_SERVICE_URL:-http://host.docker.internal:4000}
      - COSA_PLATFORM_CONTROL_PLANE_URL=${COSA_API_PLATFORM_CONTROL_PLANE_URL:-http://host.docker.internal:4001}
      - COSA_EXECUTION_PLANE_URL=${COSA_API_EXECUTION_PLANE_URL:-http://host.docker.internal:4001}
      - COSA_WORKER_SERVICE_TOKEN=${COSA_WORKER_SERVICE_TOKEN:-}
      - WORKER_SERVICE_JWT_SECRET=${WORKER_SERVICE_JWT_SECRET:?WORKER_SERVICE_JWT_SECRET is required}
      - CORS_ORIGINS=${CORS_ORIGINS:-${COSA_ALLOWED_ORIGINS:-http://localhost:3000}}
      - COSA_ALLOWED_ORIGINS=${COSA_ALLOWED_ORIGINS:-${CORS_ORIGINS:-http://localhost:3000}}
      # Task 13 (plan local-first-enterprise-knowledge) — Vault/knowledge
      # ingestion fail-closed OFF by default (khớp
      # apps/cosa/knowledge_ingestion/contracts.py::knowledge_ingestion_enabled()).
      # Volume này CHỈ mount vào cosa-api/cosa-worker/cosa-ingestion-worker
      # (Workspace Runtime Node) — TUYỆT ĐỐI KHÔNG mount vào services-cosa/
      # services-company (Platform Control Plane, ADR-LOCAL-FIRST-001).
      - KNOWLEDGE_INGESTION_ENABLED=${KNOWLEDGE_INGESTION_ENABLED:-false}
      - COSA_WORKSPACE_STORAGE_ROOT=/var/lib/cosa/workspace-storage
    volumes:
      # rw — cosa-api tự issue ticket + ghi quarantine/vault file
      # (WorkspaceDocumentStore). Chưa có disk quota/alert threshold tự động
      # ở compose dev (xem docs/operations/local-knowledge-runbook.md
      # §"Disk-full") — production PHẢI có OS/container-level enforcement
      # thật, không chỉ ghi chú ở đây.
      - cosa_workspace_storage:/var/lib/cosa/workspace-storage
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000/healthz\")' || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20
    profiles:
      - cosa
      - e2e
    restart: unless-stopped

  cosa-worker:
    build:
      context: .
      dockerfile: apps/cosa/Dockerfile.worker
    container_name: cosa_worker
    ports:
      - "127.0.0.1:8090:8090"
    environment:
      # Xem NOTE ở service cosa-api: dùng *_DOCKER_OVERRIDE riêng, không đọc thẳng
      # URL host-oriented từ .env (127.0.0.1 sai trong container network).
      - AGENT_DATABASE_URL=${COSA_API_AGENT_DATABASE_URL:-postgresql+asyncpg://agent_app:${AGENT_APP_PASSWORD:-change-me-agent-app}@postgres:5432/agent}
      - COSA_DATABASE_URL=${COSA_API_COSA_DATABASE_URL:-postgresql://cosa_app:${COSA_APP_PASSWORD:-change-me-cosa-app}@postgres:5432/cosa?sslmode=disable}
      - WORKSPACE_DATABASE_URL=${COSA_API_WORKSPACE_DATABASE_URL:-postgresql://workspace_app:${WORKSPACE_APP_PASSWORD:-change-me-workspace-app}@postgres:5432/workspace?sslmode=disable}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - COSA_MODEL_PROVIDER=${COSA_MODEL_PROVIDER:-fake}
      - COSA_CONTROL_PLANE_URL=${COSA_API_CONTROL_PLANE_URL:-http://host.docker.internal:4001}
      - COMPANY_SERVICE_URL=${COSA_API_COMPANY_SERVICE_URL:-http://host.docker.internal:4000}
      - COSA_PLATFORM_CONTROL_PLANE_URL=${COSA_API_PLATFORM_CONTROL_PLANE_URL:-http://host.docker.internal:4001}
      - COSA_EXECUTION_PLANE_URL=${COSA_API_EXECUTION_PLANE_URL:-http://host.docker.internal:4001}
      - COSA_WORKER_SERVICE_TOKEN=${COSA_WORKER_SERVICE_TOKEN:-}
      - WORKER_SERVICE_JWT_SECRET=${WORKER_SERVICE_JWT_SECRET:?WORKER_SERVICE_JWT_SECRET is required}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      - DEEPSEEK_DEFAULT_MODEL=${DEEPSEEK_DEFAULT_MODEL:-deepseek-chat}
      - COSA_WORKER_HEALTH_PORT=${COSA_WORKER_HEALTH_PORT:-8090}
      - KNOWLEDGE_INGESTION_ENABLED=${KNOWLEDGE_INGESTION_ENABLED:-false}
      - COSA_WORKSPACE_STORAGE_ROOT=/var/lib/cosa/workspace-storage
    volumes:
      # Cùng volume vật lý với cosa-api (đọc/ghi quarantine trong lúc claim +
      # convert, promote sang vault/ khi publish, xoá vật lý khi purge — Task
      # 3/5/11). rw vì worker CHÍNH là nơi purge_version()/promote_to_vault()
      # thật sự chạy.
      - cosa_workspace_storage:/var/lib/cosa/workspace-storage
    depends_on:
      postgres:
        condition: service_healthy
      cosa-api:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8090/live\")' || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20
    profiles:
      - cosa
      - e2e
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────
  # cosa-ingestion-worker — isolated document converter service
  # Knowledge Ingestion Phase A (Task 4 image, Task 7 readiness gate)
  #
  # DEVELOPMENT CONVENIENCE ONLY — this Compose service is NOT production
  # isolation and this Compose network does NOT, on its own, provide egress
  # isolation. It does NOT provide:
  # - Read-only root filesystem
  # - CPU/memory/PID/time resource limits
  # - Network egress-deny policy (containers here still reach external URLs)
  #
  # Production deployment requires an orchestrator (Kubernetes NetworkPolicy /
  # deny-all egress, ECS task definition with egress rules, gVisor/Firecracker
  # runtime, etc.) providing those controls. The image ENTRYPOINT runs
  # assert_production_ingestion_ready() which fail-closes unless the
  # orchestrator sets the attestation + backend env vars below to real values.
  #
  # Converter runs as a non-root user with markitdown[pdf,docx,pptx,xlsx]==0.1.7
  # only — never the full API/worker dependency set or business secrets.
  # ─────────────────────────────────────────────────────────────
  cosa-ingestion-worker:
    build:
      context: .
      dockerfile: apps/cosa/Dockerfile.ingestion-worker
    container_name: cosa_ingestion_worker
    environment:
      # Dev mode: readiness gate returns early for any ENVIRONMENT != production.
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - KNOWLEDGE_INGESTION_ENABLED=${KNOWLEDGE_INGESTION_ENABLED:-false}
      # In production these MUST be supplied by the orchestrator, not this file:
      #   KNOWLEDGE_INGESTION_SCANNER_BACKEND   (real scanner, not fake/none)
      #   KNOWLEDGE_INGESTION_SANDBOX_BACKEND   (isolated sandbox, not inprocess)
      #   KNOWLEDGE_INGESTION_CONVERTER_SPEC    (must equal the pinned spec)
      - KNOWLEDGE_INGESTION_RESOURCE_LIMITS_ATTESTED=${KNOWLEDGE_INGESTION_RESOURCE_LIMITS_ATTESTED:-false}
      - KNOWLEDGE_INGESTION_EGRESS_DENY_ATTESTED=${KNOWLEDGE_INGESTION_EGRESS_DENY_ATTESTED:-false}
      - COSA_WORKSPACE_STORAGE_ROOT=/var/lib/cosa/workspace-storage
    volumes:
      # ro — converter chỉ ĐỌC content đã quarantine để convert; không có lý
      # do nghiệp vụ nào để container cô lập này ghi/xoá bất cứ gì trong
      # storage root (promote/purge là việc của cosa-api/cosa-worker).
      - cosa_workspace_storage:/var/lib/cosa/workspace-storage:ro
    profiles:
      - cosa
      - knowledge-ingestion
    restart: unless-stopped

  opensandbox:
    image: opensandbox/server:0.2.2
    container_name: cosa_opensandbox
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - SANDBOX_CONFIG_PATH=/etc/opensandbox/sandbox.toml
    volumes:
      - ./infra/opensandbox/sandbox.toml:/etc/opensandbox/sandbox.toml:ro
      - /var/run/docker.sock:/var/run/docker.sock
    profiles: ["sandbox"]
    restart: unless-stopped

  livekit:
    image: livekit/livekit-server:v1.8.3
    container_name: cosa_livekit_local
    command: --config /etc/livekit.yaml
    volumes:
      - ./infra/livekit/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "127.0.0.1:7880:7880"
      - "127.0.0.1:7881:7881"
      - "127.0.0.1:50000-50020:50000-50020/udp"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:7880/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  minio_data:
  connector_state:
  # Task 13 (plan local-first-enterprise-knowledge) — Vault quarantine + vault
  # object storage cho Workspace Runtime Node. KHÔNG mount vào services-cosa/
  # services-company (Platform Control Plane) — xem docs/operations/
  # local-knowledge-runbook.md.
  cosa_workspace_storage:
