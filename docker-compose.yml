services:
  # ─────────────────────────────────────────────────────────────
  # Local PostgreSQL — dùng khi chạy trên Hostinger hoặc dev local.
  # Khi chuyển sang Viettel vDBS: bỏ profile này, set DATABASE_URL
  # và CONTROL_PLANE_DATABASE_URL trỏ tới managed DB bên ngoài.
  # ─────────────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: cosa_postgres
    ports:
      # dev-only: expose to host loopback for local psql/DB tools. Not public internet.
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-javis}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-javis}
      - POSTGRES_DB=${POSTGRES_DB:-javis}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-javis}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: cosa_minio
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────
  # legacy/backend is frozen-in-place (see ADR-012, "Correction #2"):
  # the 2026-08-22 restructure split it across 6 legacy/* directories
  # without updating this build, and it is known NOT to build cleanly
  # today (workforce/cosa_core/agent_runtime are copied in below, but
  # platform/business/domains packages it also imports are not — see
  # the ADR for the decision to extract only what agentos/ needs
  # rather than resurrect the full monolith). Gated behind --profile
  # legacy so `docker compose up` does not try to start a known-broken
  # service by default.
  # ─────────────────────────────────────────────────────────────
  migrate:
    build:
      context: .
      dockerfile: legacy/backend/Dockerfile.api
    command: alembic upgrade head
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://javis_app:change-me-javis-app@postgres:5432/javis}
    volumes:
      - ./legacy/backend:/app
      - ./legacy/agent_runtime/workforce:/app/workforce
      - ./legacy/agent_runtime/cosa_core:/app/cosa_core
      - ./legacy/agent_runtime/agent_runtime:/app/agent_runtime
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - legacy
    restart: "no"

  # ─────────────────────────────────────────────────────────────
  # Central Control Plane Schema Migration
  #
  # HOSTINGER (hiện tại): CONTROL_PLANE_DATABASE_URL trỏ vào database RIÊNG
  #   (cosa_control_plane), role RIÊNG (cosa_control_plane_app) trên cùng
  #   container `postgres` — đã tách vật lý khỏi Local Business DB (không
  #   còn co-locate chung database/role với `javis`/`javis_app`).
  #
  # VIETTEL vDBS (tương lai): chỉ cần đổi CONTROL_PLANE_DATABASE_URL
  #   thành connection string của vDBS — không thay đổi gì khác.
  #
  # Cách chạy:
  #   docker compose --profile control-plane up migrate-control-plane
  # ─────────────────────────────────────────────────────────────
  migrate-control-plane:
    build:
      context: .
      dockerfile: legacy/backend/Dockerfile.api
    container_name: cosa_migrate_control_plane
    command: alembic -c alembic_control_plane.ini upgrade head
    environment:
      # Hostinger/Local: DB + role rieng (cosa_control_plane_app@cosa_control_plane), cung container postgres
      # Viettel vDBS (tuong lai): chi can doi CONTROL_PLANE_DATABASE_URL thanh connection string cua vDBS
      - CONTROL_PLANE_DATABASE_URL=${CONTROL_PLANE_DATABASE_URL:-postgresql://cosa_control_plane_app:change-me-control-plane-app@postgres:5432/cosa_control_plane}
    volumes:
      - ./legacy/backend:/app
      - ./legacy/agent_runtime/workforce:/app/workforce
      - ./legacy/agent_runtime/cosa_core:/app/cosa_core
      - ./legacy/agent_runtime/agent_runtime:/app/agent_runtime
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - control-plane
      - legacy
    restart: "no"


  brain-api:
    build:
      context: .
      dockerfile: legacy/backend/Dockerfile.api
    container_name: cosa_brain_api
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload --reload-dir .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - APP_ENV=${APP_ENV:-development}
      - DATABASE_URL=${DATABASE_URL:-postgresql://javis_app:change-me-javis-app@postgres:5432/javis}
      - CONTROL_PLANE_DATABASE_URL=${CONTROL_PLANE_DATABASE_URL:-postgresql://cosa_control_plane_app:change-me-control-plane-app@postgres:5432/cosa_control_plane}
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      # Khóa ký JWT cho brain-api. Production phải cung cấp giá trị ngẫu nhiên qua
      # secret manager, không dùng fallback phát triển.
      - JWT_SECRET=${JWT_SECRET:-supersecret-dev-key}
      - CHAT_DEFAULT_PROVIDER=${CHAT_DEFAULT_PROVIDER:-deepseek}
      - CHAT_DEFAULT_MODEL=${CHAT_DEFAULT_MODEL:-deepseek-chat}
      # Provider keys
      - PROVIDER_CONFIGURED_OPENROUTER=${OPENROUTER_API_KEY:+1}
      - PROVIDER_CONFIGURED_DEEPSEEK=${DEEPSEEK_API_KEY:+1}
      - PROVIDER_CONFIGURED_OPENAI=${OPENAI_API_KEY:+1}
      - PROVIDER_CONFIGURED_ANTHROPIC=${ANTHROPIC_API_KEY:+1}
      - PROVIDER_CONFIGURED_GEMINI=${GEMINI_API_KEY:+1}
      # OAuth Google
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-http://localhost:8000/api/v1/connectors/google/oauth/callback}
      - MASTER_SECRET_KEY=${MASTER_SECRET_KEY:-default-insecure-master-key-for-dev}
      - LIVEKIT_URL=${LIVEKIT_URL:-wss://example.livekit.cloud}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-devkey}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-secret_local_cosa_desktop_key}
      - LIVEKIT_LOCAL_URL=${LIVEKIT_LOCAL_URL:-ws://127.0.0.1:7880}
      - LIVEKIT_LOCAL_API_KEY=${LIVEKIT_LOCAL_API_KEY:-devkey}
      - LIVEKIT_LOCAL_API_SECRET=${LIVEKIT_LOCAL_API_SECRET:-secret_local_cosa_desktop_key}
    volumes:
      - ./legacy/backend:/app
      - ./legacy/agent_runtime/workforce:/app/workforce
      - ./legacy/agent_runtime/cosa_core:/app/cosa_core
      - ./legacy/agent_runtime/agent_runtime:/app/agent_runtime
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    profiles:
      - legacy
    restart: unless-stopped

  agent-worker:
    build:
      context: .
      dockerfile: legacy/backend/Dockerfile.worker
    container_name: cosa_agent_worker
    environment:
      - APP_ENV=${APP_ENV:-development}
      - JAVIS_STATE_DIR=/var/lib/javis-connectors
      - DATABASE_URL=${DATABASE_URL:-postgresql://javis_app:change-me-javis-app@postgres:5432/javis}
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      - DEEPSEEK_DEFAULT_MODEL=${DEEPSEEK_DEFAULT_MODEL:-deepseek-chat}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - CHAT_DEFAULT_PROVIDER=${CHAT_DEFAULT_PROVIDER:-deepseek}
      - CHAT_DEFAULT_MODEL=${CHAT_DEFAULT_MODEL:-deepseek-chat}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-http://localhost:8000/api/v1/connectors/google/oauth/callback}
      - MASTER_SECRET_KEY=${MASTER_SECRET_KEY:-default-insecure-master-key-for-dev}
      # OpenSandbox Execution Runtime
      - COSA_EXECUTION_PROVIDER=${COSA_EXECUTION_PROVIDER:-mock}
      - OPEN_SANDBOX_DOMAIN=${OPEN_SANDBOX_DOMAIN:-http://opensandbox:8080}
      - OPEN_SANDBOX_API_KEY=${OPEN_SANDBOX_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      brain-api:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./legacy/backend:/app
      - ./legacy/agent_runtime/workforce:/app/workforce
      - ./legacy/agent_runtime/cosa_core:/app/cosa_core
      - ./legacy/agent_runtime/agent_runtime:/app/agent_runtime
      - connector_state:/var/lib/javis-connectors
    profiles:
      - legacy
    restart: unless-stopped

  opensandbox:
    image: opensandbox/server:0.2.2
    container_name: cosa_opensandbox
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - SANDBOX_CONFIG_PATH=/etc/opensandbox/sandbox.toml
    volumes:
      - ./infra/opensandbox/sandbox.toml:/etc/opensandbox/sandbox.toml:ro
      - /var/run/docker.sock:/var/run/docker.sock
    profiles: ["sandbox"]
    restart: unless-stopped

  livekit:
    image: livekit/livekit-server:latest
    container_name: cosa_livekit_local
    command: --config /etc/livekit.yaml
    volumes:
      - ./infra/livekit/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "127.0.0.1:7880:7880"
      - "127.0.0.1:7881:7881"
      - "127.0.0.1:50000-50020:50000-50020/udp"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:7880/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  realtime-agent:
    build:
      context: ./services/realtime_agent
      dockerfile: Dockerfile
    container_name: cosa_realtime_agent
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://javis_app:change-me-javis-app@postgres:5432/javis}
      - LIVEKIT_URL=${LIVEKIT_URL:-wss://example.livekit.cloud}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-devkey}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-secret_local_cosa_desktop_key}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GOOGLE_API_KEY=${GEMINI_API_KEY:-}
      - LIVEKIT_LOCAL_HTTP_URL=http://livekit:7880
      - LIVEKIT_LOCAL_URL=ws://livekit:7880
      - LIVEKIT_LOCAL_API_KEY=${LIVEKIT_LOCAL_API_KEY:-devkey}
      - LIVEKIT_LOCAL_API_SECRET=${LIVEKIT_LOCAL_API_SECRET:-secret_local_cosa_desktop_key}
      - VOICE_INTERRUPTION_MIN_DURATION=${VOICE_INTERRUPTION_MIN_DURATION:-0.5}
      - VOICE_MIN_ENDPOINTING_DELAY=${VOICE_MIN_ENDPOINTING_DELAY:-0.5}
      - VOICE_MAX_ENDPOINTING_DELAY=${VOICE_MAX_ENDPOINTING_DELAY:-3.0}
    volumes:
      - ./legacy/backend:/app/backend
      - ./services/realtime_agent:/app
    depends_on:
      postgres:
        condition: service_healthy
      livekit:
        condition: service_healthy
    restart: unless-stopped

  # Second worker process registered against LiveKit Cloud instead of the
  # local server (main.py::_resolve_local_livekit prefers local whenever it's
  # healthy, so a plain second copy of `realtime-agent` would just re-register
  # on local too). Desktop rooms are created on local LiveKit and only this
  # worker's local-registered sibling above ever sees them; mobile/web rooms
  # are created on LIVEKIT_URL (cloud) and only this worker sees those - each
  # worker's LiveKit signaling connection only receives dispatches for the one
  # server it registered with, so running both concurrently is what makes
  # desktop-local and mobile-cloud voice both get an AI in the room.
  realtime-agent-cloud:
    build:
      context: ./services/realtime_agent
      dockerfile: Dockerfile
    container_name: cosa_realtime_agent_cloud
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://javis_app:change-me-javis-app@postgres:5432/javis}
      - LIVEKIT_URL=${LIVEKIT_URL:-wss://example.livekit.cloud}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-devkey}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-secret_local_cosa_desktop_key}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GOOGLE_API_KEY=${GEMINI_API_KEY:-}
      - LIVEKIT_FORCE_CLOUD=true
      - VOICE_INTERRUPTION_MIN_DURATION=${VOICE_INTERRUPTION_MIN_DURATION:-0.5}
      - VOICE_MIN_ENDPOINTING_DELAY=${VOICE_MIN_ENDPOINTING_DELAY:-0.5}
      - VOICE_MAX_ENDPOINTING_DELAY=${VOICE_MAX_ENDPOINTING_DELAY:-3.0}
    volumes:
      - ./legacy/backend:/app/backend
      - ./services/realtime_agent:/app
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
  connector_state:
