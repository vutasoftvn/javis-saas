id: strategy.gate-evaluation-flow
name: Strategy Gate Evaluation Flow
version: 1.0.0
description: Declarative multi-step strategy gate evaluation with compensation
steps:
  - id: fetch_evidence
    type: tool_call
    tool: strategy.evidence.list
  - id: evaluate_gate
    type: tool_call
    tool: strategy.gate_evaluation.create
    depends_on: [fetch_evidence]
  - id: notify_founder
    type: tool_call
    tool: notification.send
    depends_on: [evaluate_gate]
    on_failure: compensate_notify
  - id: compensate_notify
    type: tool_call
    tool: notification.retry_or_log
