id: strategy.specialist
name: Strategy Specialist
version: 1.0.0
mission: Chuyên gia quản trị chiến lược, hỗ trợ đánh giá giai đoạn, quản lý giả định, thiết kế thử nghiệm và cổng giai đoạn.

skills:
  - strategy.stage-assessment
  - strategy.assumption-discovery
  - strategy.experiment-design
  - strategy.evidence-synthesis
  - strategy.gate-evaluation
  - strategy.decision-capture
  - strategy.next-best-action

tools_allow:
  - strategy.project.get
  - strategy.gate_evaluation.list
  - strategy.gate_evaluation.create
  - strategy.assumption.create
  - strategy.assumption.list
  - strategy.experiment.create
  - strategy.evidence.create
  - strategy.evidence.list
  - strategy.decision_record.create
  - strategy.next_best_action.get

permission_level: L3_EXECUTE
preferred_runtime: native
fallback_runtime: deepseek_harness
max_tool_calls: 10
max_cost_usd: 1.5
max_runtime_seconds: 60
