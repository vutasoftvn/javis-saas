name: cosa

services:
  # ============================================================================
  # Central PostgreSQL 16 (Database độc lập cho COSA Central Control Plane)
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: cosa_db
    restart: unless-stopped
    ports:
      - "127.0.0.1:5434:5432"
    environment:
      POSTGRES_DB: ${CENTRAL_POSTGRES_DB:-cosa}
      POSTGRES_USER: ${CENTRAL_POSTGRES_USER:-cosa_central_admin}
      POSTGRES_PASSWORD: ${CENTRAL_POSTGRES_PASSWORD:?CENTRAL_POSTGRES_PASSWORD must be explicitly configured in production environment}
    volumes:

      - central_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${CENTRAL_POSTGRES_USER:-cosa_central_admin} -d ${CENTRAL_POSTGRES_DB:-cosa}" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  central_pgdata:
