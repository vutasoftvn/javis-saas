version: '3.8'

services:
  # ============================================================================
  # 1. Reverse Proxy với tự động cấp chứng chỉ SSL Let's Encrypt
  # ============================================================================
  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      - CENTRAL_API_DOMAIN=${CENTRAL_API_DOMAIN:-api.cosa.vn}
      - MARKETING_WILDCARD_DOMAIN=${MARKETING_WILDCARD_DOMAIN:-*.cosa.vn}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - central_api

  # ============================================================================
  # 2. Central Control Plane Schema Migration (Alembic)
  # ============================================================================
  migrate_control_plane:
    build:
      context: ../../backend
      dockerfile: Dockerfile.api
    command: alembic -c alembic_control_plane.ini upgrade head
    environment:
      - CONTROL_PLANE_DATABASE_URL=postgresql://${POSTGRES_USER:-cosa_central_admin}:${POSTGRES_PASSWORD:-SecureCentralPass2026}@central_postgres:5432/${POSTGRES_DB:-cosa_central}
    depends_on:
      central_postgres:
        condition: service_healthy
    restart: "no"

  # ============================================================================
  # 3. Central Control Plane API (FastAPI)
  # ============================================================================
  central_api:
    build:
      context: ../../backend
      dockerfile: Dockerfile.api
    restart: always
    # APP_ROLE=central_control_plane (Quyết định 3): backend/central_main.py
    # chỉ import platform_core.sync.router (ký entitlement + nhận
    # PlatformOutbox/Inbox) - không bao giờ founder_os/business/workforce/
    # integrations, và không đi qua platform_core.router aggregator
    # (auth/vault/organization/tech_radar/...).
    #
    # `command` PHẢI override CMD mặc định của Dockerfile.api - CMD mặc định
    # chạy `alembic upgrade head` vô điều kiện, sẽ áp toàn bộ Alembic
    # migration của schema local/company vào chính database central này.
    # Schema của control plane được quản lý độc lập bởi alembic_control_plane.ini
    # thông qua service `migrate_control_plane` ở trên.
    #
    # COSA_RUNTIME_PLANE=control mở endpoint /entitlement/sign (xem
    # backend/platform_core/sync/router.py) - thiếu biến này, mặc định
    # "company", central_api sẽ không có route ký entitlement dù đã mount
    # đúng router.
    command: uvicorn central_main:app --host 0.0.0.0 --port 8000
    environment:
      - APP_ROLE=central_control_plane
      - COSA_RUNTIME_PLANE=control
      - DATABASE_URL=postgresql://${POSTGRES_USER:-cosa_central_admin}:${POSTGRES_PASSWORD:-SecureCentralPass2026}@central_postgres:5432/${POSTGRES_DB:-cosa_central}
      - COSA_PLATFORM_SIGNING_SECRET=${COSA_PLATFORM_SIGNING_SECRET:-cosa_platform_master_signing_key_2026_production}
      - ENVIRONMENT=production
      - PYTHONUNBUFFERED=1
    depends_on:
      central_postgres:
        condition: service_healthy
      migrate_control_plane:
        condition: service_completed_successfully

  # ============================================================================
  # 4. Central PostgreSQL 16 (Siêu nhẹ ~80MB RAM thay thế toàn bộ Supabase)
  # ============================================================================
  central_postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cosa_central}
      POSTGRES_USER: ${POSTGRES_USER:-cosa_central_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SecureCentralPass2026}
    volumes:
      - central_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cosa_central_admin} -d ${POSTGRES_DB:-cosa_central}" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  central_pgdata:
  caddy_data:
  caddy_config:
