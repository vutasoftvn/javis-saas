name: cosa

services:
  # ============================================================================
  # Central PostgreSQL 18 (Database độc lập cho COSA Central Control Plane)
  # ============================================================================
  postgres:
    image: pgvector/pgvector:pg18 # Pinned release tag
    container_name: cosa_db
    restart: unless-stopped
    ports:
      - "127.0.0.1:5434:5432"
    environment:
      POSTGRES_DB: ${CENTRAL_POSTGRES_DB:-postgres}
      POSTGRES_USER: ${CENTRAL_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${CENTRAL_POSTGRES_PASSWORD:?CENTRAL_POSTGRES_PASSWORD must be explicitly configured in production environment}
      AGENT_APP_PASSWORD: ${AGENT_APP_PASSWORD:?AGENT_APP_PASSWORD must be explicitly configured}
      AGENT_MIGRATOR_PASSWORD: ${AGENT_MIGRATOR_PASSWORD:?AGENT_MIGRATOR_PASSWORD must be explicitly configured}
      COSA_APP_PASSWORD: ${COSA_APP_PASSWORD:?COSA_APP_PASSWORD must be explicitly configured}
      COSA_MIGRATOR_PASSWORD: ${COSA_MIGRATOR_PASSWORD:?COSA_MIGRATOR_PASSWORD must be explicitly configured}
      WORKSPACE_APP_PASSWORD: ${WORKSPACE_APP_PASSWORD:?WORKSPACE_APP_PASSWORD must be explicitly configured}
      WORKSPACE_MIGRATOR_PASSWORD: ${WORKSPACE_MIGRATOR_PASSWORD:?WORKSPACE_MIGRATOR_PASSWORD must be explicitly configured}
    volumes:
      # PG18 image: PGDATA = /var/lib/postgresql/18/docker, nên mount THƯ MỤC CHA /var/lib/postgresql.
      # Volume MỚI (central_pgdata18): volume pg16 cũ (central_pgdata) giữ nguyên để rollback —
      # không thể dùng lại data dir PG16 cho PG18. Xem docs/runbooks/postgres-18-production-upgrade.md
      - central_pgdata18:/var/lib/postgresql
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${CENTRAL_POSTGRES_USER:-postgres} -d ${CENTRAL_POSTGRES_DB:-postgres}" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  central_pgdata18:
