apiVersion: cosa.ai/skill-eval/v1
kind: SkillEvalSuite
skill:
  id: research.dossier
  version: 1.0.0
cases:
- id: accepts-governed-context
  input:
    workspace_id: ws-eval
    project_id: project-eval
    entity_name: "Acme Corp"
    hypothesis: "Acme is consolidating vendor spend on cloud platforms"
  expected:
    outcome: accept
- id: missing-workspace
  input:
    project_id: project-eval
    entity_name: "Acme Corp"
    hypothesis: "Acme is consolidating vendor spend"
  expected:
    outcome: reject
    reason: missing-workspace
- id: missing-hypothesis
  input:
    workspace_id: ws-eval
    project_id: project-eval
    entity_name: "Acme Corp"
    hypothesis: ""
  expected:
    outcome: reject
    reason: missing-hypothesis
- id: confirmation-bias-unbalanced
  input:
    workspace_id: ws-eval
    project_id: project-eval
    entity_name: "Acme Corp"
    hypothesis: "Acme is unbeatable"
    disconfirming_ratio: 0.05
  expected:
    outcome: reject
    reason: confirmation-bias-unbalanced
