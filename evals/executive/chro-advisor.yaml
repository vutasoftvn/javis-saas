apiVersion: cosa.ai/skill-eval/v1
kind: SkillEvalSuite
skill:
  id: executive.chro-advisor
  version: 1.0.0
cases:
- id: accepts-governed-context
  input:
    workspace_id: ws-eval
    project_id: project-eval
  expected:
    outcome: accept
- id: missing-workspace
  input:
    project_id: project-eval
  expected:
    outcome: reject
    reason: missing-workspace
- id: cross-workspace
  input:
    workspace_id: ws-other
    project_id: project-eval
  expected:
    outcome: reject
    reason: cross-workspace
- id: peer-draft-forbidden
  input:
    workspace_id: ws-eval
    project_id: project-eval
    peer_drafts:
      - role_key: cfo
        draft_text: "sample"
  expected:
    outcome: reject
    reason: peer-draft-forbidden
- id: pii-in-request
  input:
    workspace_id: ws-eval
    project_id: project-eval
    contact_email: "candidate@example.com"
  expected:
    outcome: reject
    reason: pii-in-request
- id: workforce-mutation-attempt
  input:
    workspace_id: ws-eval
    project_id: project-eval
    action: "terminate_workforce_member"
  expected:
    outcome: reject
    reason: workforce-mutation-attempt
