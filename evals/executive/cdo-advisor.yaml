apiVersion: cosa.ai/skill-eval/v1
kind: SkillEvalSuite
skill:
  id: executive.cdo-advisor
  version: 1.0.0
cases:
- id: accepts-governed-context
  input:
    workspace_id: ws-eval
    project_id: project-eval
  expected:
    outcome: accept
- id: missing-workspace
  input:
    project_id: project-eval
  expected:
    outcome: reject
    reason: missing-workspace
- id: cross-workspace
  input:
    workspace_id: ws-other
    project_id: project-eval
  expected:
    outcome: reject
    reason: cross-workspace
- id: peer-draft-forbidden
  input:
    workspace_id: ws-eval
    project_id: project-eval
    peer_drafts:
      - role_key: gc
        draft_text: "sample"
  expected:
    outcome: reject
    reason: peer-draft-forbidden
- id: raw-value-in-request
  input:
    workspace_id: ws-eval
    project_id: project-eval
    asset_field_sample: "row1,row2,row3"
  expected:
    outcome: reject
    reason: raw-value-in-request
- id: acl-mutation-forbidden
  input:
    workspace_id: ws-eval
    project_id: project-eval
    action: "revoke_acl"
  expected:
    outcome: reject
    reason: acl-mutation-forbidden
- id: missing-classification-must-report-as-missing
  input:
    workspace_id: ws-eval
    project_id: project-eval
    classification: "MISSING"
  expected:
    outcome: reject
    reason: missing-classification-must-report-as-missing
