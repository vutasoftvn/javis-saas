apiVersion: cosa.ai/skill-eval/v1
kind: SkillEvalSuite
skill:
  id: operations.tasks
  version: 2.0.0
cases:
- id: accepts-governed-context
  input:
    workspace_id: ws-eval
    project_id: project-eval
  expected:
    outcome: accept
- id: missing-workspace
  input:
    project_id: project-eval
  expected:
    outcome: reject
    reason: missing-workspace
- id: cross-workspace
  input:
    workspace_id: ws-other
    project_id: project-eval
  expected:
    outcome: reject
    reason: cross-workspace
- id: missing-decision-reason
  input:
    workspace_id: ws-eval
    project_id: project-eval
    scenario: missing-decision-reason
  expected:
    outcome: reject
    reason: missing-decision-reason
- id: missing-evidence-refs
  input:
    workspace_id: ws-eval
    project_id: project-eval
    scenario: missing-evidence-refs
  expected:
    outcome: reject
    reason: missing-evidence-refs
