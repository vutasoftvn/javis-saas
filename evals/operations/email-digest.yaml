apiVersion: cosa.ai/skill-eval/v1
kind: SkillEvalSuite
skill:
  id: operations.email-digest
  version: 1.0.0
cases:
- id: accepts-governed-context
  input:
    workspace_id: ws-eval
    project_id: project-eval
  expected:
    outcome: accept
- id: missing-workspace
  input:
    project_id: project-eval
  expected:
    outcome: reject
    reason: missing-workspace
- id: cross-workspace
  input:
    workspace_id: ws-other
    project_id: project-eval
  expected:
    outcome: reject
    reason: cross-workspace
- id: email-not-connected
  input:
    workspace_id: ws-eval
    project_id: project-eval
    scenario: email-not-connected
  expected:
    outcome: reject
    reason: email-not-connected
- id: unverified-founder-channel
  input:
    workspace_id: ws-eval
    project_id: project-eval
    scenario: unverified-founder-channel
  expected:
    outcome: reject
    reason: unverified-founder-channel
- id: foreign-recipient-requested
  input:
    workspace_id: ws-eval
    project_id: project-eval
    scenario: foreign-recipient-requested
  expected:
    outcome: reject
    reason: foreign-recipient-requested
