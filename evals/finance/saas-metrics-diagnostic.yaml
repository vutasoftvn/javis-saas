apiVersion: cosa.ai/skill-eval/v1
kind: SkillEvalSuite
skill:
  id: finance.saas-metrics-diagnostic
  version: 1.0.0
cases:
- id: accepts-governed-context
  input:
    workspace_id: ws-eval
    project_id: project-eval
  expected:
    outcome: accept
- id: missing-workspace
  input:
    project_id: project-eval
  expected:
    outcome: reject
    reason: missing-workspace
- id: cross-workspace
  input:
    workspace_id: ws-other
    project_id: project-eval
  expected:
    outcome: reject
    reason: cross-workspace
- id: uncalculated-scale-rejected
  input:
    workspace_id: ws-eval
    project_id: project-eval
    scenario: scale-acquisition-with-leaky-bucket
  expected:
    outcome: reject
    reason: scale-acquisition-with-leaky-bucket
