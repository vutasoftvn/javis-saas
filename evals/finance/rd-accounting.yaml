apiVersion: cosa.ai/skill-eval/v1
kind: SkillEvalSuite
skill:
  id: finance.rd-accounting
  version: 1.0.0
cases:
- id: accepts-governed-context
  input:
    workspace_id: ws-eval
    project_id: project-eval
    finance_owner: "Nguyen Van A (Head of Finance)"
    standard: "ifrs"
  expected:
    outcome: accept
- id: missing-workspace
  input:
    project_id: project-eval
    finance_owner: "Nguyen Van A"
  expected:
    outcome: reject
    reason: missing-workspace
- id: missing-finance-owner
  input:
    workspace_id: ws-eval
    project_id: project-eval
    finance_owner: ""
  expected:
    outcome: reject
    reason: missing-finance-owner
- id: auto-booking-violation
  input:
    workspace_id: ws-eval
    project_id: project-eval
    auto_book_journal_entry: true
  expected:
    outcome: reject
    reason: auto-booking-violation
