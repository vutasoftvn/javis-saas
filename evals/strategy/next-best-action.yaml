apiVersion: cosa.ai/skill-eval/v1
kind: SkillEvalSuite
skill:
  id: strategy.next-best-action
  version: 1.0.1
cases:
- id: accepts-governed-context
  input:
    workspace_id: ws-eval
    project_id: project-eval
  expected:
    outcome: accept
- id: missing-workspace
  input:
    project_id: project-eval
  expected:
    outcome: reject
    reason: missing-workspace
- id: cross-workspace
  input:
    workspace_id: ws-other
    project_id: project-eval
  expected:
    outcome: reject
    reason: cross-workspace
- id: missing-project-context
  input:
    workspace_id: ws-eval
    project_id: project-eval
    scenario: missing-project-context
  expected:
    outcome: reject
    reason: missing-project-context
