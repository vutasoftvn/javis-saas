version = "0.1.0"
description = "Runtime adapter implementations (LangChain, LangGraph, Google ADK, OpenAI Agents SDK, DeepSeek Harness, LiteLLM, MCP, A2A, AG-UI, OTel) cho agent contracts."
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
]

