[project]
name = "agent-core"
version = "0.1.0"
description = "COSA Agent Platform Core — framework-neutral contracts, durable run substrate, capability gateway, governance."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "openai>=1.0.0",
    "sqlalchemy>=2.0.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

# Không thêm langchain/langgraph/google-adk/openai-agents/deepseek-harness-sdk/litellm vào đây.
# Các dependency đó thuộc packages/agent_integrations/<runtime>/, theo ADR-RUNTIME-001 và
# COSA_AGENT_PLATFORM_BLUEPRINT_V2_RECONCILED_PLAN_2026-08-24.md Phần C — agent_core phải
# boot/test được mà không cần cài bất kỳ runtime framework nào.

# Chưa khai [build-system]/wheel target: hiện repo chạy agent_core qua PYTHONPATH
# (pytest.ini `pythonpath = . packages apps`, Makefile `agent-core-test`), chưa có nơi nào
# pip-install package này như 1 dependency thật. File pyproject.toml này phục vụ mục đích
# uv workspace (tách dependency khỏi packages/agent_integrations/*) trước — thêm build-system
# khi có nhu cầu build wheel thật (vd. agent_integrations/langchain cần declare "agent-core"
# làm dependency qua package index thay vì PYTHONPATH).
