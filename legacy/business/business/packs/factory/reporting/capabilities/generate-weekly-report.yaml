id: reporting.generate_weekly_report
name:
  vi: "Lập Báo cáo Điều hành Tuần"
  en: "Generate Weekly Executive Report"
domain: reporting
execution_mode: assisted
artifact_type: RPT
risk:
  level: low
  admin_review: false
required_context:
  - company
inputs:
  required:
    - results
    - kpi_summary
  optional:
    - unfinished_tasks
    - issues_and_risks
    - decisions_needed
uses:
  skill: executive-reporting
  sop: weekly-reporting-cycle
  template: weekly-report
legal_context:
  required: false
output:
  canonical_format: structured_document
  allowed_exports:
    - md
    - pdf
