id: product_tech.security_incident
version: "1.0.0"
objective: "Quy trình ứng phó và khắc phục sự cố an ninh thông tin, rò rỉ dữ liệu."
steps:
  - id: isolate_threat
    action: revoke_compromised_credentials
  - id: assess_data_impact
    action: scan_audit_logs
  - id: notify_stakeholders
    action: prepare_incident_communication
  - id: patch_and_restore
    action: apply_security_fix
business_rules:
  - data_breach_must_be_contained_under_2h
