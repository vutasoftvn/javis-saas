id: finance.cash_in_out
version: "1.0.0"
objective: "Quản lý luồng tiền thu - chi và đối chiếu quỹ hàng ngày."
steps:
  - id: receive_payment_request
    action: validate_invoices_and_approvals
  - id: execute_disbursement
    action: trigger_payment_gateway_or_manual_transfer
  - id: capture_receipt
    action: record_cash_entry
  - id: daily_reconciliation
    action: verify_ending_balance
business_rules:
  - no_disbursement_without_approved_voucher
