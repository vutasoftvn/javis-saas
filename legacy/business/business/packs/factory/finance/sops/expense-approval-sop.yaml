id: expense-approval-sop
title: "Quy trình Phê duyệt Chi phí & Kiểm soát Ngân sách Nội bộ"
version: "1.0.0"
domain: finance
jurisdiction: VN
purpose: "Chuẩn hóa các bước trình ký, kiểm tra tính hợp lệ chứng từ và duyệt chi phí theo Luật Kế toán 2015."
steps:
  - step: 1
    name: "Tạo Đề xuất Chi tiêu / Mua sắm"
    description: "Nhân sự hoặc bộ phận tạo đề xuất chi trên hệ thống kèm báo giá so sánh (nếu trên hạn mức quy định)."
  - step: 2
    name: "Kiểm soát Ngân sách Bộ phận"
    description: "Kế toán quản trị/Kế toán trưởng đối chiếu hạn mức ngân sách tháng/quý của bộ phận đề xuất."
  - step: 3
    name: "Phê duyệt theo Thẩm quyền (DOA)"
    description: "Cấp quản lý trực tiếp và Giám đốc tài chính/CEO phê duyệt trên hệ thống theo bảng phân quyền hạn mức chi tiêu."
  - step: 4
    name: "Thực hiện Chi tiền & Lưu trữ Chứng từ"
    description: "Thủ quỹ/Kế toán thanh toán chuyển khoản và lưu trữ đầy đủ hóa đơn chứng từ điện tử theo quy định."
    compliance_check: "Điều 16, Điều 18 Luật Kế toán 2015"
