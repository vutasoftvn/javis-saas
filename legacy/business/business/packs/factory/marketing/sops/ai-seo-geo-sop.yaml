id: marketing.ai_seo_geo
version: "1.0.0"
objective: "Quy trình xây dựng cấu trúc nội dung, Schema Markup và Entity Citations giúp thương hiệu xuất hiện trong câu trả lời của AI Search."
steps:
  - id: extract_core_entities_and_intents
    name: "Trích xuất thực thể cốt lõi và ý định tìm kiếm AI"
    action: map_brand_products_and_comparison_queries
  - id: generate_json_ld_schema
    name: "Tạo dữ liệu có cấu trúc Schema.org JSON-LD"
    action: produce_software_faq_and_organization_schemas
  - id: draft_direct_answer_blocks
    name: "Biên tập các khối câu trả lời trực diện 50-70 từ"
    action: write_concise_definitive_snippets
  - id: build_comparison_matrices
    name: "Xây dựng bảng so sánh đa chiều có số liệu định lượng"
    action: generate_benchmark_and_alternative_tables
  - id: audit_external_citations
    name: "Rà soát trích dẫn trên các nền tảng đánh giá độc lập"
    action: verify_g2_capterra_and_github_profiles
business_rules:
  - all_schema_must_pass_google_rich_results_test
  - every_claim_must_cite_verifiable_data_or_primary_source
